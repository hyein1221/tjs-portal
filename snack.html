function orderSelected(){return S.orders.find(o=>o.id===S.orderId)||S.orders[0]||null}
function surveySelected(){return S.surveys.find(s=>s.id===S.surveyId)||S.surveys[0]||null}
function isOpen(v,closedStatus='finalized'){return v&&v.status!=='finalized'&&v.status!=='closed'&&new Date(v.deadline)>new Date()}
function menuSummary(order,selections){const list=[];for(const section of order?.catalog||[]){const menu=section.items.find(m=>m.id===selections?.[section.id]);if(menu)list.push(`${menu.name} (${money(menu.price)})`);}return list.join(' + ')||'선택 없음'}
function menuNames(order,selections){const list=[];for(const section of order?.catalog||[]){const menu=section.items.find(m=>m.id===selections?.[section.id]);if(menu)list.push(menu.name);}return list.join(' + ')||'선택 없음'}
function selectedTotal(order,selected){return (order?.catalog||[]).reduce((sum,s)=>sum+Number(s.items.find(m=>m.id===selected?.[s.id])?.price||0),0)}
function tagFor(status){return status==='ordered'?'<span class="tag green">신청 완료</span>':status==='leave'?'<span class="tag gray">연차</span>':status==='declined'?'<span class="tag yellow">신청 안 함</span>':'<span class="tag gray">미신청</span>'}
async function bootstrap(silent=false){if(S.loading)return;S.loading=true;try{const r=await api('bootstrap');S.user=r.user;S.isAdmin=r.isAdmin;S.managerConfigured=r.managerConfigured;S.staff=r.staff||[];S.orders=r.orders||[];S.surveys=r.surveys||[];if(!S.orderId||!S.orders.some(o=>o.id===S.orderId))S.orderId=S.orders[0]?.id||null;if(!S.surveyId||!S.surveys.some(o=>o.id===S.surveyId))S.surveyId=S.surveys[0]?.id||null;
    $('#account').textContent=`로그인: ${S.user.name} / ${S.user.class_name}`;$('#tabSettings').classList.toggle('hidden',!S.isAdmin);
    if(S.managerPw&&S.mode==='manager')await loadManager();if(S.isAdmin&&S.mode==='settings')await loadAdmin();if(!silent)notify('최신 정보를 불러왔습니다.','ok');render();
  }catch(e){notify(e.message,'bad');if(!S.user)$('#teacher').innerHTML='<div class="empty"><a class="btn primary" href="index.html">통합포털로 이동</a></div>'}finally{S.loading=false}}
async function loadManager(){if(!S.managerPw)return;try{const r=await api('manager_data',{},true);S.orders=r.orders||[];S.surveys=r.surveys||[];S.people=r.people||[];S.extraStaff=r.extraStaff||[];S.submissions=r.submissions||[];S.mealResponses=r.mealResponses||[];S.distributions=r.distributions||[];if(!S.orders.some(o=>o.id===S.deliveryOrderId))S.deliveryOrderId=S.orders[0]?.id||null;if(!S.orders.some(o=>o.id===S.orderId))S.orderId=S.orders[0]?.id||null;if(!S.surveys.some(o=>o.id===S.surveyId))S.surveyId=S.surveys[0]?.id||null;}catch(e){if(/비밀번호|잠겼|설정해야/.test(e.message))S.managerPw='';throw e;}}
async function afterWrite(message,manager=false){if(manager)await loadManager();if(S.isAdmin&&S.mode==='settings')await loadAdmin();await bootstrap(true);notify(message,'ok');}
function switchTab(mode){if(mode==='settings'&&!S.isAdmin)return;S.mode=mode;if(mode==='settings'&&S.isAdmin){loadAdmin().then(()=>render()).catch(e=>notify(e.message,'bad'));}render();}
function render(){for(const tab of ['teacher','manager','settings']){$('#'+tab).classList.toggle('hidden',S.mode!==tab);$('#tab'+tab[0].toUpperCase()+tab.slice(1)).classList.toggle('active',S.mode===tab);}if(S.mode==='teacher')renderTeacher();if(S.mode==='manager')renderManager();if(S.mode==='settings')renderSettings();}
function imageHtml(o){return o?.image_url?`<div class="image-area"><img id="menuImage" alt="담당자가 등록한 메뉴판" src="${esc(o.image_url)}"><div class="muted small" style="margin-top:7px">메뉴판 사진을 누르면 확대할 수 있어요.</div></div>`:'<div class="image-area muted">아직 등록된 메뉴판 사진이 없습니다. 아래 메뉴명을 확인해주세요.</div>'}
function wireImage(){const im=$('#menuImage');if(!im)return;im.onclick=()=>{const div=document.createElement('div');div.className='img-large';div.setAttribute('role','dialog');div.setAttribute('aria-label','메뉴판 사진 확대');div.innerHTML=`<img alt="메뉴판 확대" src="${esc(im.src)}">`;div.onclick=()=>div.remove();document.body.appendChild(div);};}
function targetOptions(type,group){return type==='self'?[{key:'u:'+S.user.id,name:S.user.name,group:S.user.class_name}]:S.staff.filter(m=>m.group===group);}
function statusBy(order,key){return (order?.statuses||[]).find(x=>x.target_key===key)}
function ownEntry(order,key){return (order?.my_entries||[]).find(x=>x.target_key===key)}
function renderPickers(rootId,typeKey,groupKey,targetKey,orderOrSurvey,kind){const type=S[typeKey],group=S[groupKey],selected=S[targetKey],statuses=orderOrSurvey?.statuses||[];
  return `<div class="field"><label class="label">① 신청 구분</label><div class="switches"><button data-kind="${kind}" data-type="self" class="${type==='self'?'active':''}">본인 신청</button><button data-kind="${kind}" data-type="other" class="${type==='other'?'active':''}">기타 직군 신청</button></div></div>`+
  (type==='other'?`<div class="field"><label class="label">② 소속 선택</label><div class="switches">${GROUPS.map(g=>`<button data-kind="${kind}" data-group="${esc(g)}" class="${g===group?'active':''}">${esc(g)}</button>`).join('')}</div></div>`:'')+
  `<div class="field"><label class="label">${type==='other'?'③ 신청할 선생님':'신청 대상'}</label><div class="person-grid">${targetOptions(type,group).map(p=>{const status=statuses.find(x=>x.target_key===p.key);return `<button class="person ${selected===p.key?'active':''} ${status?'done':''}" data-kind="${kind}" data-target="${esc(p.key)}"><strong>${esc(p.name)}</strong><small>${status?`${kind==='teacher'?status.status==='ordered'?'신청 완료':status.status==='leave'?'연차':'신청 안 함':status.answer==='yes'?'점심 식사':'점심 미식사'} · ${esc(status.requested_by_name)}`:'미신청'}</small></button>`}).join('')||'<div class="muted small">선택 가능한 교직원이 없습니다.</div>'}</div></div>`;
}
function bindPickers(kind){const isMeal=kind==='meal',root=$('#'+(isMeal?'meal':'teacher'));$$(`[data-kind="${kind}"]`,root).forEach(b=>b.onclick=()=>{
  const typeKey=isMeal?'mealType':'applyType',groupKey=isMeal?'mealGroup':'otherGroup',targetKey=isMeal?'mealTargetKey':'targetKey';
  if(b.dataset.type){S[typeKey]=b.dataset.type;S[targetKey]=null;S.menuSelection={};S.menuTouched=false;S.mealAnswer='';}
  if(b.dataset.group){S[groupKey]=b.dataset.group;S[targetKey]=null;S.menuSelection={};S.menuTouched=false;S.mealAnswer='';}
  if(b.dataset.target){S[targetKey]=b.dataset.target;S.menuSelection={};S.menuTouched=false;S.mealAnswer='';}
  isMeal?renderMeal():renderTeacher();
});}
function mySummary(o){const list=o?.my_entries||[];if(!list.length)return '<div class="muted small">아직 내가 신청한 내역이 없습니다.</div>';
  return list.map(e=>`<div class="summary-item"><div><strong>${esc(e.target_name)} <span class="muted small">${e.target_key==='u:'+S.user.id?'(본인 신청)':`(신청 교사: ${esc(e.requested_by_name)})`}</span></strong><div class="muted small">${e.status==='ordered'?esc(menuNames(o,e.selections)):e.status==='leave'?'연차':'신청 안 함'}</div></div><span class="tag ${e.status==='ordered'?'green':'gray'}">${e.status==='ordered'?'신청 완료':e.status==='leave'?'연차':'신청 안 함'}</span></div>`).join('');
}
function renderTeacher(){
  const root=$('#teacher');if(!S.user){root.innerHTML='<div class="empty">통합포털 로그인 정보를 확인하고 있습니다.</div>';return;}
  if(S.user.name==='김혜인'&&S.user.class_name==='관리자'){
    root.innerHTML='<div class="card"><h2>관리자용 계정 안내</h2><div class="note info">관리자 / 김혜인 계정은 간식 신청 대상자 명단과 전체 인원 집계에서 제외되어 있습니다. 간식 신청은 꿈빛반 / 김혜인 계정으로 로그인해 주세요. 담당자 관리와 관리자 설정은 이 계정에서 계속 이용할 수 있습니다.</div></div>';
    return;
  }
  const o=activeOrder();const linked=o?S.surveys.find(s=>s.order_id===o.id&&isOpen(s)):null;
  const s=linked||S.surveys.find(s=>!s.order_id&&isOpen(s))||null;
  if(!o&&!s){root.innerHTML='<div class="card"><div class="empty"><h3>현재 진행 중인 간식 신청이나 식수조사가 없습니다.</h3></div></div>';return;}
  const live=o&&isOpen(o),key=S.applyType==='self'?'u:'+S.user.id:S.targetKey;

      ${mealStatus&&!mealOwn?`<div class="note warn">이미 ${esc(mealStatus.requested_by_name)} 교사가 식수조사에 응답했습니다.</div>`:!isOpen(s)?'<div class="note warn">식수조사가 마감되었습니다.</div>':`<div class="options"><label class="option ${answer==='yes'?'active':''}"><input type="radio" name="inlineMealAnswer" value="yes" ${answer==='yes'?'checked':''}><span>어린이집 점심 먹음</span></label><label class="option ${answer==='no'?'active':''}"><input type="radio" name="inlineMealAnswer" value="no" ${answer==='no'?'checked':''}><span>어린이집 점심 먹지 않음</span></label></div><div class="muted small" style="margin-top:9px">식수조사가 진행 중이라면 위 응답도 함께 선택한 후 아래 저장 버튼을 눌러주세요.</div>`}
    </div>`;
  }
  let snackHtml='';
  if(o){snackHtml=`<div class="card"><div class="row between"><div><div class="muted small">${esc(o.round_label)}</div><h2 style="margin:3px 0">${esc(o.outlet)}</h2><div class="muted small">배부일 ${dateFmt(o.distribution_date)} · 신청 마감 ${timeFmt(o.deadline)}</div></div>${live?'<span class="tag">신청 중</span>':'<span class="tag yellow">신청 마감</span>'}</div><div style="margin-top:14px">${imageHtml(o)}</div></div>`;}
  root.innerHTML=`${snackHtml}<div class="card"><h2>간식 신청${s?' · 식수조사':''}</h2>${renderPickers('teacher','applyType','otherGroup','targetKey',o||s,'teacher')}
    ${!key?'<div class="note info">신청할 선생님을 선택해주세요.</div>':''}
    ${o?(!editableSnack?status&&!own?`<div class="note warn">간식은 이미 ${esc(status.requested_by_name)} 교사가 신청했습니다.</div>`:'<div class="note warn">간식 신청 기간이 종료되었습니다.</div>':`<div class="divider"></div><h3>간식 메뉴 선택</h3>${(o.catalog||[]).map(sec=>`<div class="menu-card"><h3>${esc(sec.title)} <span class="muted small">(최대 1개)</span></h3><div class="options"><label class="option ${!selected[sec.id]?'active':''}"><input type="radio" name="pick_${esc(sec.id)}" data-section="${esc(sec.id)}" value="" ${!selected[sec.id]?'checked':''}><span>선택 안 함</span></label>${sec.items.map(m=>`<label class="option ${selected[sec.id]===m.id?'active':''}"><input type="radio" name="pick_${esc(sec.id)}" data-section="${esc(sec.id)}" value="${esc(m.id)}" ${selected[sec.id]===m.id?'checked':''}><span>${esc(m.name)}</span></label>`).join('')}</div></div>`).join('')}<div class="note info" id="orderPreview">선택한 메뉴: <b>${esc(menuNames(o,selected))}</b></div>`):''}
    ${mealContent}

    </div>${o?`<div class="card"><h2>내가 신청한 간식 내역</h2>${mySummary(o)}</div>`:''}${s?`<div class="card"><h2>내가 응답한 식수조사</h2>${mealMySummary(s)}</div>`:''}`;
  wireImage();bindPickers('teacher');
  $$('[data-section]',root).forEach(r=>r.onchange=()=>{S.menuSelection={...(S.menuTouched?S.menuSelection:selected)};S.menuTouched=true;if(r.value)S.menuSelection[r.dataset.section]=r.value;else delete S.menuSelection[r.dataset.section];
    $$('.option',r.closest('.options')).forEach(x=>x.classList.remove('active'));r.closest('.option').classList.add('active');const p=$('#orderPreview');if(p)p.innerHTML=`선택한 메뉴: <b>${esc(menuNames(o,S.menuSelection))}</b>`;});
  $$('[name="inlineMealAnswer"]',root).forEach(r=>r.onchange=()=>{S.mealAnswer=r.value;$$('[name="inlineMealAnswer"]',root).forEach(x=>x.closest('.option').classList.toggle('active',x.checked));});
  if($('#saveCombined'))$('#saveCombined').onclick=async()=>{const snackSelection=S.menuTouched?S.menuSelection:selected;
    const shouldSnack=editableSnack&&Object.keys(snackSelection).length>0;

    if(!shouldSnack&&!shouldMeal)return alert('신청할 간식 또는 식수조사 응답을 선택해주세요.');

    const btn=$('#saveCombined');btn.disabled=true;try{await api('teacher_submit_combined',{orderId:shouldSnack?o.id:null,surveyId:shouldMeal?s.id:null,targetKey:key,selections:shouldSnack?snackSelection:null,answer:shouldMeal?answer:null});
      S.menuTouched=false;S.menuSelection={};S.mealAnswer='';await afterWrite('신청 내용이 저장되었습니다.');}
    catch(e){notify(e.message,'bad');btn.disabled=false;}};
}
function mealMySummary(s){const list=s?.my_responses||[];return list.length?list.map(r=>`<div class="summary-item"><div><strong>${esc(r.target_name)} <span class="muted small">${r.target_key==='u:'+S.user.id?'(본인 신청)':`(신청 교사: ${esc(r.requested_by_name)})`}</span></strong><div class="muted small">${r.answer==='yes'?'어린이집에서 점심 먹음':'어린이집에서 점심 먹지 않음'}</div></div><span class="tag green">응답 완료</span></div>`).join(''):'<div class="muted small">아직 내가 응답한 내역이 없습니다.</div>'}
async function loadAdmin(){if(!S.isAdmin)return;const r=await api('admin_data');S.adminExtra=r.extraStaff||[];S.adminOrders=r.orders||[];S.adminSurveys=r.surveys||[];S.extraStaff=S.adminExtra.filter(x=>x.active);S.adminLoaded=true;}

    <h3 style="margin-top:18px">간식 주문 회차</h3><div class="tablewrap"><table><thead><tr><th>회차</th><th>주문처</th><th>배부일</th><th>상태</th><th>관리</th></tr></thead><tbody>${S.adminOrders.map(o=>`<tr><td>${esc(o.round_label)}</td><td>${esc(o.outlet)}</td><td>${dateFmt(o.distribution_date)}</td><td>${o.archived_at?'목록에서 제외':'사용 중'}</td><td><button class="btn ${o.archived_at?'second':'danger'} sm" data-admin-order="${o.id}" data-archive="${o.archived_at?'restore':'archive'}">${o.archived_at?'복구':'항목 삭제'}</button></td></tr>`).join('')||'<tr><td colspan="5">주문 기록이 없습니다.</td></tr>'}</tbody></table></div>
    <h3 style="margin-top:18px">식수조사 회차</h3><div class="tablewrap"><table><thead><tr><th>조사 날짜</th><th>점심 메뉴</th><th>연결 주문</th><th>상태</th><th>관리</th></tr></thead><tbody>${S.adminSurveys.map(s=>`<tr><td>${dateFmt(s.survey_date)}</td><td>${esc(String(s.lunch_menu).slice(0,60))}</td><td>${s.order_id?'간식 주문 연동':'단독 조사'}</td><td>${s.archived_at?'목록에서 제외':'사용 중'}</td><td><button class="btn ${s.archived_at?'second':'danger'} sm" data-admin-survey="${s.id}" data-archive="${s.archived_at?'restore':'archive'}">${s.archived_at?'복구':'항목 삭제'}</button></td></tr>`).join('')||'<tr><td colspan="5">식수조사가 없습니다.</td></tr>'}</tbody></table></div></div>`;
  r.innerHTML=`<nav class="subtabs" aria-label="관리자 설정 세부 메뉴">${sections.map(([k,v])=>`<button type="button" data-admin-view="${k}" class="${S.settingsView===k?'active':''}">${v}</button>`).join('')}</nav><div class="admin-pane ${S.settingsView==='password'?'':'hidden'}">${passwordHtml}</div><div class="admin-pane ${S.settingsView==='staff'?'':'hidden'}">${staffHtml}</div><div class="admin-pane ${S.settingsView==='delete'?'':'hidden'}">${deleteHtml}</div>`;
  $$('[data-admin-view]',r).forEach(b=>b.onclick=()=>{S.settingsView=b.dataset.adminView;renderSettings()});

function orderStats(o){
  const rs=S.submissions.filter(x=>x.order_id===o.id);
  const ordered=rs.filter(x=>x.status==='ordered');
  const leave=rs.filter(x=>x.status==='leave').length,declined=rs.filter(x=>x.status==='declined').length;
  const responded=new Set(rs.map(r=>r.target_key));
  const missing=S.people.filter(p=>!responded.has(p.key)).length;
  const excluded=leave+declined;
  const sum=ordered.reduce((a,e)=>a+selectedTotal(o,e.selections),0);
  const qty=ordered.reduce((a,e)=>a+Object.keys(e.selections||{}).length,0);
  const grouped=[];
  for(const section of o.catalog||[]){
    const items=section.items||[];
    if(!items.length)continue;
    let subtotalCount=0,subtotalMoney=0;
    items.forEach((m,i)=>{
      const n=ordered.filter(r=>r.selections?.[section.id]===m.id).length;
      const amount=n*Number(m.price||0);
      subtotalCount+=n;subtotalMoney+=amount;
      grouped.push(`<tr class="${i===0?'category-start':''}">${i===0?`<td class="category-cell" rowspan="${items.length}">${esc(section.title)}</td>`:''}<td>${esc(m.name)}</td><td class="numeric">${n}개</td><td class="numeric">${money(m.price)}</td><td class="numeric">${money(amount)}</td></tr>`);
    });
    grouped.push(`<tr class="account-subtotal"><td colspan="2">${esc(section.title)} 소계</td><td class="numeric">${subtotalCount}개</td><td class="numeric">—</td><td class="numeric">${money(subtotalMoney)}</td></tr>`);
  }
  if(!grouped.length)grouped.push('<tr><td colspan="5" class="muted" style="text-align:center;padding:20px">등록된 메뉴가 없습니다.</td></tr>');
  return `<div class="grid4">
    <div class="stat"><small>전체 대상자</small><strong>${S.people.length}명</strong></div>
    <div class="stat"><small>신청 완료</small><strong>${ordered.length}명</strong></div>
    <div class="stat excluded"><small>신청 제외</small><strong>${excluded}명</strong><small>연차 ${leave}명 · 신청 안 함 ${declined}명</small></div>
    <div class="stat pending"><small>미신청</small><strong>${missing}명</strong></div>
  </div>
  <div class="muted small" style="margin:10px 0 14px">${S.people.length}명 = 신청 완료 ${ordered.length}명 + 신청 제외 ${excluded}명 + 미신청 ${missing}명 · 주문 메뉴 ${qty}개 · 주문 금액 <b style="color:var(--ink)">${money(sum)}</b></div>
  <div class="tablewrap"><table class="accounting-table"><thead><tr><th>메뉴 항목</th><th>메뉴명</th><th class="numeric">수량</th><th class="numeric">단가</th><th class="numeric">금액</th></tr></thead><tbody>${grouped.join('')}<tr class="account-total"><td colspan="2">총 주문 합계</td><td class="numeric">${qty}개</td><td class="numeric">—</td><td class="numeric">${money(sum)}</td></tr></tbody></table></div>`;
}

}
function printOrderReport(o){

    <div class="report-metrics"><div>전체 대상자 <b>${S.people.length}명</b></div><div>신청 완료 <b>${ordered.length}명</b></div><div>신청 제외 <b>${leave+declined}명</b> <small>(연차 ${leave}명 · 신청 안 함 ${declined}명)</small></div><div>미신청 <b>${missing}명</b></div></div>

// 각 주문 회차의 실제 신청 완료자만 배부 대상으로 표시합니다.
// 배부는 사람당 한 번만 체크하며, 메뉴 항목 수와 관계없이 사람 단위로 기록합니다.
function deliveryOrder(){return S.orders.find(o=>o.id===S.deliveryOrderId)||orderSelected()}
function deliveryCandidates(order){
  if(!order)return [];
  const people=new Map(S.people.map(p=>[p.key,p]));
  return S.submissions.filter(r=>r.order_id===order.id&&r.status==='ordered'&&people.has(r.target_key))
    .map(r=>({key:r.target_key,name:people.get(r.target_key).name,group:people.get(r.target_key).group,selections:r.selections}))
    .sort((a,b)=>String(a.group).localeCompare(String(b.group),'ko')||a.name.localeCompare(b.name,'ko'));
}
function deliveryInDivision(person){
  if(S.deliveryDivision==='전체')return true;
  if(S.deliveryDivision==='기타 직군')return GROUPS.includes(person.group)&&(!S.deliveryGroup||S.deliveryGroup===person.group);
  const classrooms=DELIVERY_CLASSES[S.deliveryDivision]||[];
  const normalized=String(person.group||'').replace(/\s+/g,'').replace(/반$/,'');
  if(!classrooms.some(c=>c.replace(/반$/,'')===normalized))return false;
  return !S.deliveryGroup||S.deliveryGroup.replace(/반$/,'')===normalized;
}
function deliveryVisible(order){const query=S.deliveryQuery.trim().toLocaleLowerCase('ko');return deliveryCandidates(order).filter(p=>deliveryInDivision(p)&&(!query||p.name.toLocaleLowerCase('ko').includes(query)||String(p.group).toLocaleLowerCase('ko').includes(query)));}
function deliveryHtml(){

  const visible=deliveryVisible(o),totalDone=all.filter(p=>done.has(p.key)).length,viewDone=visible.filter(p=>done.has(p.key)).length;

  const every=visible.length>0&&visible.every(p=>done.has(p.key));
  return `<div class="card"><div class="row between" style="gap:12px;flex-wrap:wrap"><div><h2 style="margin:0 0 4px">📦 간식 배부 확인</h2><p class="muted small" style="margin:0">수령한 사람만 체크하세요. 체크·해제 즉시 공동 저장됩니다.</p></div><button type="button" class="btn second sm" id="refreshDelivery">↻ 배부 현황 새로고침</button></div>
    <div class="field" style="margin-top:16px"><label class="label" for="deliveryOrderSelector">배부 확인할 간식 회차</label><select class="select" id="deliveryOrderSelector">${S.orders.map(q=>`<option value="${esc(q.id)}" ${q.id===o.id?'selected':''}>${esc(q.round_label)} · ${esc(q.outlet)} · ${dateFmt(q.distribution_date)}</option>`).join('')}</select></div>
    <div class="note info">선택한 회차: <b>${esc(o.round_label)} · ${esc(o.outlet)}</b><br>간식 신청 마감 또는 주문 확정 후에도 배부를 확인할 수 있습니다. 다른 회차의 체크 내역과 섞이지 않습니다.</div>
    <div class="grid3 delivery-summary"><div class="stat"><small>배부 대상</small><strong>${all.length}명</strong></div><div class="stat"><small>배부 완료</small><strong>${totalDone}명</strong></div><div class="stat pending"><small>미배부</small><strong>${all.length-totalDone}명</strong></div></div>
    <h3>소속별 조회</h3><div class="delivery-tabs">${DELIVERY_DIVISIONS.map(v=>`<button type="button" data-delivery-division="${esc(v)}" class="${S.deliveryDivision===v?'active':''}">${esc(v)}</button>`).join('')}</div>
    ${S.deliveryDivision==='전체'?'':`<div class="delivery-tabs"><button type="button" data-delivery-group="" class="${S.deliveryGroup===''?'active':''}">전체 ${S.deliveryDivision==='기타 직군'?'소속':'반'}</button>${second.map(g=>`<button type="button" data-delivery-group="${esc(g)}" class="${S.deliveryGroup===g?'active':''}">${esc(g)}</button>`).join('')}</div>`}
    <div class="field" style="max-width:460px"><label class="label" for="deliverySearch">이름 검색 (선택)</label><input class="input" id="deliverySearch" placeholder="찾을 교직원 이름" value="${esc(S.deliveryQuery)}" autocomplete="off"></div>
    <div class="delivery-bulk-header"><label class="delivery-all-wrap" for="deliverySelectVisible"><input type="checkbox" id="deliverySelectVisible" ${every?'checked':''} ${visible.length?'':'disabled'}><span>현재 조회 중인 ${visible.length}명 전체 배부 완료</span></label><span class="muted small">조회 중 ${viewDone}명 완료 / ${visible.length-viewDone}명 미배부</span></div>
    <div class="tablewrap delivery-table-wrap"><table class="delivery-table"><thead><tr><th class="delivery-check-cell">확인</th><th>소속</th><th>교직원</th><th>신청한 간식</th><th>배부 상태</th></tr></thead><tbody>${visible.map(p=>`<tr class="${done.has(p.key)?'delivered-row':''}"><td class="delivery-check-cell"><input type="checkbox" data-delivery-key="${esc(p.key)}" aria-label="${esc(p.name)} 배부 완료" ${done.has(p.key)?'checked':''}></td><td>${esc(p.group)}</td><td><strong>${esc(p.name)}</strong></td><td class="delivery-menu">${esc(menuNames(o,p.selections))}</td><td>${done.has(p.key)?'<span class="tag green">배부 완료</span>':'<span class="tag gray">미배부</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:22px">선택한 조건의 간식 신청자가 없습니다.</td></tr>'}</tbody></table></div>
    <p class="muted small" style="margin-top:12px">※ 위쪽 전체 선택은 <b>현재 조회 중인 명단에만</b> 적용됩니다. 연차·신청 안 함·미신청자는 배부 대상에 표시되지 않습니다.</p>
  </div>`;
}
function bindDeliveryTab(){
  const selector=$('#deliveryOrderSelector');if(!selector)return;
  selector.onchange=()=>{S.deliveryOrderId=selector.value;S.deliveryDivision='전체';S.deliveryGroup='';S.deliveryQuery='';renderManager()};
  $$('[data-delivery-division]').forEach(b=>b.onclick=()=>{S.deliveryDivision=b.dataset.deliveryDivision;S.deliveryGroup='';S.deliveryQuery='';renderManager()});
  $$('[data-delivery-group]').forEach(b=>b.onclick=()=>{S.deliveryGroup=b.dataset.deliveryGroup;S.deliveryQuery='';renderManager()});
  const query=$('#deliverySearch');if(query)query.oninput=()=>{const pos=query.selectionStart;S.deliveryQuery=query.value;renderManager();const next=$('#deliverySearch');next?.focus();try{next?.setSelectionRange(pos,pos)}catch{}};
  const refresh=$('#refreshDelivery');if(refresh)refresh.onclick=async()=>{if(S.deliveryBusy)return;S.deliveryBusy=true;refresh.disabled=true;try{await loadManager();renderManager();notify('배부 현황을 새로고침했습니다.','ok')}catch(e){notify(e.message,'bad');refresh.disabled=false}finally{S.deliveryBusy=false}};
  async function saveDelivery(keys,delivered){
    if(S.deliveryBusy||!keys.length)return;
    S.deliveryBusy=true;
    $$('[data-delivery-key]').forEach(el=>el.disabled=true);
    const master=$('#deliverySelectVisible');if(master)master.disabled=true;
    try{
      const order=deliveryOrder();await api('manager_set_distributions',{orderId:order.id,targetKeys:keys,delivered},true);
      const changed=new Set(keys);
      S.distributions=S.distributions.filter(d=>!(d.order_id===order.id&&changed.has(d.target_key)));
      if(delivered)S.distributions.push(...keys.map(k=>({order_id:order.id,target_key:k,delivered_at:new Date().toISOString()})));
      notify(delivered?`${keys.length}명의 간식을 배부 완료로 표시했습니다.`:`${keys.length}명의 배부 표시를 취소했습니다.`,'ok');
      renderManager();
    }catch(e){notify(e.message,'bad');renderManager()}
    finally{S.deliveryBusy=false}
  }
  $$('[data-delivery-key]').forEach(input=>input.onchange=()=>saveDelivery([input.dataset.deliveryKey],input.checked));
  const all=$('#deliverySelectVisible');if(all){
    const o=deliveryOrder(),visible=deliveryVisible(o),done=new Set(S.distributions.filter(x=>x.order_id===o.id).map(x=>x.target_key));
    const checkedVisible=visible.filter(p=>done.has(p.key));
    all.indeterminate=checkedVisible.length>0&&checkedVisible.length<visible.length;
    all.onchange=()=>{
      const wanted=all.checked;
      const keys=visible.filter(p=>wanted?!done.has(p.key):done.has(p.key)).map(p=>p.key);
      if(!keys.length){renderManager();return}
      if(!confirm(`현재 조회 중인 ${keys.length}명을 ${wanted?'배부 완료':'미배부'}로 일괄 변경할까요?\n다른 반과 다른 주문 회차에는 영향을 주지 않습니다.`)){renderManager();return}
      saveDelivery(keys,wanted);
    };
  }
}

  if(!S.managerConfigured){root.innerHTML='<div class="card"><div class="empty"><h3>담당자 비밀번호 설정 전입니다.</h3><p>통합포털 관리자가 관리자 설정에서 숫자 4자리 비밀번호를 먼저 설정해주세요.</p></div></div>';return;}

async function encodeImage(file){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('이미지 파일만 등록해주세요.');
  const bitmap=await createImageBitmap(file),limit=1800,scale=Math.min(1,limit/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));if(!blob||blob.size>3*1024*1024)throw Error('사진 용량을 줄인 뒤 다시 시도해주세요. (3MB 이하)');
  return {mime:'image/jpeg',imageBase64:await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(String(rd.result).split(',')[1]);rd.onerror=()=>reject(Error('사진 읽기에 실패했습니다.'));rd.readAsDataURL(blob);})};
}

  setInterval(async()=>{if(document.hidden||S.loading||S.mode!=='manager'||!S.managerPw||S.editingOrder||S.editingMeal||S.entryEditKey||S.mealEditKey||$('#manager')?.contains(document.activeElement))return;try{await loadManager();renderManager()}catch(e){notify(e.message,'bad')}},30000);
}
initialize();
</script></body></html>
