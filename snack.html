<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5146dd"><title>교사 간식 주문 도우미 | 탕정삼성어린이집</title>
<style>
:root{--p:#5146dd;--pd:#3730a3;--bg:#f7f8fc;--card:#fff;--ink:#182338;--muted:#68758b;--line:#e4e8f1;--shadow:0 8px 24px rgba(19,29,61,.05)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line)}.top-in{max-width:1120px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:-.04em;font-size:18px}.wrap{max-width:1120px;margin:auto;padding:0 18px 40px}.hero{padding:22px 0 4px}.hero h1{font-size:27px;letter-spacing:-.045em;margin:0}.hero p{color:var(--muted);font-size:13px;margin:6px 0}.tabs{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.tab{border:1px solid var(--line);padding:11px 17px;background:#fff;border-radius:12px;color:var(--muted);font-weight:800}.tab.active{background:var(--p);border-color:var(--p);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}.card h2{font-size:20px;margin:0 0 12px}.card h3{font-size:16px;margin:0 0 12px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.wraprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.input,.select,.ta{width:100%;padding:10px 12px;border:1px solid #d1d8e5;border-radius:10px;background:#fff;outline:0;min-width:0}.ta{resize:vertical;min-height:86px}.input:focus,.select:focus,.ta:focus{border-color:var(--p);box-shadow:0 0 0 3px #5146dd17}.label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}.field{margin:0 0 12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn.primary{background:var(--p);color:#fff}.btn.primary:hover{background:var(--pd)}.btn.second{background:#eef1f8;color:#31415e}.btn.ghost{background:#fff;color:#334155;border:1px solid var(--line)}.btn.green{background:#15803d;color:#fff}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.sm{font-size:12px;padding:7px 10px}.btn.full{width:100%}.muted{color:var(--muted)}.small{font-size:12px}.note{padding:12px 14px;border-radius:12px;font-size:13px;margin:12px 0}.note.info{background:#eef2ff;color:#3730a3}.note.ok{background:#ecfdf5;color:#166534}.note.warn{background:#fff7ed;color:#92400e}.note.bad{background:#fef2f2;color:#991b1b}.empty{border:1px dashed #cbd5e1;border-radius:13px;text-align:center;padding:30px 12px;color:var(--muted)}.hidden{display:none!important}.tag{display:inline-flex;align-items:center;background:#eef2ff;color:#3730a3;padding:4px 9px;border-radius:50px;font-weight:800;font-size:11px}.tag.green{background:#dcfce7;color:#166534}.tag.gray{background:#f1f5f9;color:#64748b}.tag.yellow{background:#fef3c7;color:#92400e}.stat{border:1px solid var(--line);padding:13px;border-radius:13px;background:#fbfcff}.stat small{display:block;color:var(--muted)}.stat strong{font-size:26px;display:block;letter-spacing:-.04em}.box{padding:14px;border-radius:14px;border:1px solid var(--line)}.soft{background:#f8f9fd}.switches{display:flex;gap:7px;flex-wrap:wrap}.switches button{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;color:#40516a;font-weight:700}.switches button.active{background:#eef2ff;border-color:#9b98f3;color:#4338ca}.person-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.person{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 12px;text-align:left;min-height:66px}.person.active{background:#efefff;border-color:#8b86f3}.person strong{display:block}.person small{color:var(--muted)}.person.done{background:#f8fafc}.menu-card{margin-top:12px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-height:54px}.option.active{border-color:#9b98f3;background:#f0efff}.option input{accent-color:var(--p);width:16px;height:16px}.option span{flex:1;min-width:0}.summary-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.summary-item:last-child{border-bottom:0}.image-area{border:1px dashed #cbd3e2;border-radius:13px;padding:14px;background:#fafbfe;text-align:center}.image-area img{display:block;max-width:100%;max-height:360px;object-fit:contain;margin:auto;border-radius:9px;cursor:zoom-in}.img-large{position:fixed;inset:0;z-index:50;background:rgba(16,23,42,.88);display:flex;align-items:center;justify-content:center;padding:24px}.img-large img{max-width:95vw;max-height:90vh;object-fit:contain}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:middle}th{background:#f8fafc;color:#52627b;font-weight:900}tr:last-child td{border-bottom:0}.editor-section{border:1px solid var(--line);border-radius:13px;background:#fdfdff;padding:14px;margin:10px 0}.editor-items{margin-top:10px}.edit-line{display:grid;grid-template-columns:1.8fr .9fr auto;gap:7px;margin:7px 0}.divider{height:1px;background:var(--line);margin:18px 0}.staff-filter{display:flex;gap:7px;flex-wrap:wrap}.footer-space{height:18px}@media(max-width:740px){.wrap{padding:0 11px 25px}.top-in{padding:10px 11px;flex-wrap:wrap}.brand{font-size:16px}.hero h1{font-size:24px}.card{padding:14px}.grid2,.grid3,.options{grid-template-columns:1fr}.person-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs .tab{flex:1;padding:10px 8px;font-size:12px}.edit-line{grid-template-columns:minmax(0,1fr) 104px auto}.stat strong{font-size:22px}}
</style></head>
<body>
<header class="top"><div class="top-in"><div class="brand">☕ 교사 간식 주문 도우미</div><div class="wraprow"><button id="refresh" class="btn second sm">↻ 새로고침</button><a href="index.html" class="btn ghost sm">⌂ 통합포털 홈</a></div></div></header>
<main class="wrap"><div class="hero"><h1>교사 간식 주문</h1><p>간식 신청과 점심 식수조사를 편리하게 진행하고, 신청 현황을 함께 확인합니다.</p></div>
<div id="message"></div><div id="account" class="muted small"></div>
<nav class="tabs" aria-label="간식 주문 메뉴"><button id="tabTeacher" class="tab active">간식 신청</button><button id="tabMeal" class="tab">식수조사</button><button id="tabManager" class="tab">담당자 관리</button><button id="tabSettings" class="tab hidden">관리자 설정</button></nav>
<section id="teacher"></section><section id="meal" class="hidden"></section><section id="manager" class="hidden"></section><section id="settings" class="hidden"></section><div class="footer-space"></div></main>
<script>
'use strict';
const SUPABASE_URL='https://vohcugxfwxdvkbcpjcgl.supabase.co';
const SUPABASE_PUBLIC_KEY='sb_publishable_Q0cXaglzBaz9Py2oct_NTQ_vMHsUeSQ';
const API_URL=SUPABASE_URL+'/functions/v1/snack-api';
const GROUPS=['사무실','영아보조','누리보조·연장반','조리실','보건실·환경·소장님'];
const $=(s,root=document)=>root.querySelector(s),$$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const comma=n=>(String(n||'').replace(/[^\d]/g,'')||'').replace(/\B(?=(\d{3})+(?!\d))/g,',');
const dateFmt=d=>d?String(d).slice(0,10).replaceAll('-','.'):'-';
const timeFmt=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'-':d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
const today=()=>{const d=new Date(),n=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${n(d.getMonth()+1)}-${n(d.getDate())}`};
const localDT=v=>{const d=new Date(v);if(Number.isNaN(d.getTime()))return'';const n=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${n(d.getMonth()+1)}-${n(d.getDate())}T${n(d.getHours())}:${n(d.getMinutes())}`};
const newId=()=>crypto.randomUUID?.()||('id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));
const newSection=()=>({id:newId(),title:'',items:[{id:newId(),name:'',price:''}]});
const blankCatalog=()=>[newSection()];
const S={account:null,user:null,isAdmin:false,managerConfigured:false,orders:[],surveys:[],staff:[],people:[],extraStaff:[],submissions:[],mealResponses:[],managerPw:'',mode:'teacher',loading:false,orderId:null,surveyId:null,applyType:'self',otherGroup:GROUPS[0],targetKey:null,mealType:'self',mealGroup:GROUPS[0],mealTargetKey:null,menuSelection:{},menuTouched:false,mealAnswer:'yes',newCatalog:blankCatalog(),editCatalog:null,editingOrder:false,editingMeal:false,entryEditKey:null,mealEditKey:null};
function portalAccount(){for(const k of ['libraryCurrentUser','materialsCurrentUser','consumablesCurrentUser','childRightsCurrentUser']){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v?.id&&typeof v.password==='string'&&v.password)return v}catch{}}return null}
function notify(message='',kind='info'){$('#message').innerHTML=message?`<div class="note ${kind}">${esc(message)}</div>`:'';}
async function api(action,payload={},manager=false){if(!S.account)throw Error('통합포털에 다시 로그인해주세요.');const req={action,credential:{id:S.account.id,password:S.account.password},...payload};if(manager)req.managerPassword=S.managerPw;
  let res;try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLIC_KEY},body:JSON.stringify(req),cache:'no-store'});}catch{throw Error('서버에 연결하지 못했습니다. 인터넷과 snack-api 배포 상태를 확인해주세요.');}
  let data;try{data=await res.json();}catch{throw Error('서버 응답을 읽지 못했습니다.');}if(!res.ok)throw Error(data?.error||`서버 오류 ${res.status}`);return data;
}
function activeOrder(){return S.orders.find(o=>o.status==='open'&&new Date(o.deadline)>new Date())||S.orders[0]||null}
function activeSurvey(){return S.surveys.find(o=>o.status==='open'&&new Date(o.deadline)>new Date())||S.surveys[0]||null}
function orderSelected(){return S.orders.find(o=>o.id===S.orderId)||S.orders[0]||null}
function surveySelected(){return S.surveys.find(s=>s.id===S.surveyId)||S.surveys[0]||null}
function isOpen(v,closedStatus='finalized'){return v&&v.status!=='finalized'&&v.status!=='closed'&&new Date(v.deadline)>new Date()}
function menuSummary(order,selections){const list=[];for(const section of order?.catalog||[]){const menu=section.items.find(m=>m.id===selections?.[section.id]);if(menu)list.push(`${menu.name} (${money(menu.price)})`);}return list.join(' + ')||'선택 없음'}
function selectedTotal(order,selected){return (order?.catalog||[]).reduce((sum,s)=>sum+Number(s.items.find(m=>m.id===selected?.[s.id])?.price||0),0)}
function tagFor(status){return status==='ordered'?'<span class="tag green">신청 완료</span>':status==='leave'?'<span class="tag gray">연차</span>':status==='declined'?'<span class="tag yellow">신청 안 함</span>':'<span class="tag gray">미신청</span>'}
async function bootstrap(silent=false){if(S.loading)return;S.loading=true;try{const r=await api('bootstrap');S.user=r.user;S.isAdmin=r.isAdmin;S.managerConfigured=r.managerConfigured;S.staff=r.staff||[];S.orders=r.orders||[];S.surveys=r.surveys||[];if(!S.orderId||!S.orders.some(o=>o.id===S.orderId))S.orderId=S.orders[0]?.id||null;if(!S.surveyId||!S.surveys.some(o=>o.id===S.surveyId))S.surveyId=S.surveys[0]?.id||null;
    $('#account').textContent=`로그인: ${S.user.name} / ${S.user.class_name}`;$('#tabSettings').classList.toggle('hidden',!S.isAdmin);
    if(S.managerPw&&S.mode==='manager')await loadManager();if(!silent)notify('최신 정보를 불러왔습니다.','ok');render();
  }catch(e){notify(e.message,'bad');if(!S.user)$('#teacher').innerHTML='<div class="empty"><a class="btn primary" href="index.html">통합포털로 이동</a></div>'}finally{S.loading=false}}
async function loadManager(){if(!S.managerPw)return;try{const r=await api('manager_data',{},true);S.orders=r.orders||[];S.surveys=r.surveys||[];S.people=r.people||[];S.extraStaff=r.extraStaff||[];S.submissions=r.submissions||[];S.mealResponses=r.mealResponses||[];if(!S.orders.some(o=>o.id===S.orderId))S.orderId=S.orders[0]?.id||null;if(!S.surveys.some(o=>o.id===S.surveyId))S.surveyId=S.surveys[0]?.id||null;}catch(e){if(/비밀번호|잠겼|설정해야/.test(e.message))S.managerPw='';throw e;}}
async function afterWrite(message,manager=false){if(manager)await loadManager();await bootstrap(true);notify(message,'ok');}
function switchTab(mode){if(mode==='settings'&&!S.isAdmin)return;S.mode=mode;render();}
function render(){for(const tab of ['teacher','meal','manager','settings']){$('#'+tab).classList.toggle('hidden',S.mode!==tab);$('#tab'+tab[0].toUpperCase()+tab.slice(1)).classList.toggle('active',S.mode===tab);}if(S.mode==='teacher')renderTeacher();if(S.mode==='meal')renderMeal();if(S.mode==='manager')renderManager();if(S.mode==='settings')renderSettings();}
function imageHtml(o){return o?.image_url?`<div class="image-area"><img id="menuImage" alt="담당자가 등록한 메뉴판" src="${esc(o.image_url)}"><div class="muted small" style="margin-top:7px">메뉴판 사진을 누르면 확대할 수 있어요.</div></div>`:'<div class="image-area muted">아직 등록된 메뉴판 사진이 없습니다. 아래 메뉴명과 금액을 확인해주세요.</div>'}
function wireImage(){const im=$('#menuImage');if(!im)return;im.onclick=()=>{const div=document.createElement('div');div.className='img-large';div.setAttribute('role','dialog');div.setAttribute('aria-label','메뉴판 사진 확대');div.innerHTML=`<img alt="메뉴판 확대" src="${esc(im.src)}">`;div.onclick=()=>div.remove();document.body.appendChild(div);};}
function targetOptions(type,group){return type==='self'?[{key:'u:'+S.user.id,name:S.user.name,group:S.user.class_name}]:S.staff.filter(m=>m.group===group);}
function statusBy(order,key){return (order?.statuses||[]).find(x=>x.target_key===key)}
function ownEntry(order,key){return (order?.my_entries||[]).find(x=>x.target_key===key)}
function renderPickers(rootId,typeKey,groupKey,targetKey,orderOrSurvey,kind){const type=S[typeKey],group=S[groupKey],selected=S[targetKey],statuses=orderOrSurvey?.statuses||[];
  return `<div class="field"><label class="label">① 신청 구분</label><div class="switches"><button data-kind="${kind}" data-type="self" class="${type==='self'?'active':''}">본인 신청</button><button data-kind="${kind}" data-type="other" class="${type==='other'?'active':''}">기타 직군 신청</button></div></div>`+
  (type==='other'?`<div class="field"><label class="label">② 소속 선택</label><div class="switches">${GROUPS.map(g=>`<button data-kind="${kind}" data-group="${esc(g)}" class="${g===group?'active':''}">${esc(g)}</button>`).join('')}</div></div>`:'')+
  `<div class="field"><label class="label">${type==='other'?'③ 신청할 선생님':'신청 대상'}</label><div class="person-grid">${targetOptions(type,group).map(p=>{const status=statuses.find(x=>x.target_key===p.key);return `<button class="person ${selected===p.key?'active':''} ${status?'done':''}" data-kind="${kind}" data-target="${esc(p.key)}"><strong>${esc(p.name)}</strong><small>${status?`${kind==='teacher'?status.status==='ordered'?'신청 완료':status.status==='leave'?'연차':'신청 안 함':status.answer==='yes'?'점심 식사':'점심 미식사'} · ${esc(status.requested_by_name)}`:'미신청'}</small></button>`}).join('')||'<div class="muted small">선택 가능한 교직원이 없습니다.</div>'}</div></div>`;
}
function bindPickers(kind){const isMeal=kind==='meal',root=$('#'+(isMeal?'meal':'teacher'));$$(`[data-kind="${kind}"]`,root).forEach(b=>b.onclick=()=>{
  const typeKey=isMeal?'mealType':'applyType',groupKey=isMeal?'mealGroup':'otherGroup',targetKey=isMeal?'mealTargetKey':'targetKey';
  if(b.dataset.type){S[typeKey]=b.dataset.type;S[targetKey]=null;}
  if(b.dataset.group){S[groupKey]=b.dataset.group;S[targetKey]=null;}
  if(b.dataset.target){S[targetKey]=b.dataset.target;S.menuSelection={};S.menuTouched=false;}
  isMeal?renderMeal():renderTeacher();
});}
function mySummary(o){const list=o?.my_entries||[];if(!list.length)return '<div class="muted small">아직 내가 신청한 내역이 없습니다.</div>';
  return list.map(e=>`<div class="summary-item"><div><strong>${esc(e.target_name)} <span class="muted small">${e.target_key==='u:'+S.user.id?'(본인 신청)':`(신청 교사: ${esc(e.requested_by_name)})`}</span></strong><div class="muted small">${e.status==='ordered'?esc(menuSummary(o,e.selections)):e.status==='leave'?'연차':'신청 안 함'}</div></div><div class="row"><strong>${e.status==='ordered'?money(selectedTotal(o,e.selections)):'—'}</strong></div></div>`).join('')+`<div class="row between" style="margin-top:12px"><b>내 신청 총 금액</b><strong>${money(list.reduce((v,e)=>v+(e.status==='ordered'?selectedTotal(o,e.selections):0),0))}</strong></div>`;
}
function renderTeacher(){const root=$('#teacher');if(!S.user){root.innerHTML='<div class="empty">통합포털 로그인 정보를 확인하고 있습니다.</div>';return}
  const o=activeOrder();if(!o){root.innerHTML='<div class="card"><div class="empty"><h3>현재 진행 중인 간식 신청이 없습니다.</h3><p>담당자가 새로운 주문을 시작하면 여기에 표시됩니다.</p></div></div>';return;}
  const live=isOpen(o),key=S.applyType==='self'?'u:'+S.user.id:S.targetKey;const status=statusBy(o,key),own=ownEntry(o,key);
  if(!S.targetKey&&S.applyType==='self')S.targetKey='u:'+S.user.id;
  const selected=S.menuTouched?S.menuSelection:(own?.selections||{});
  root.innerHTML=`<div class="card"><div class="row between"><div><div class="muted small">${esc(o.round_label)}</div><h2 style="margin:3px 0">${esc(o.outlet)}</h2><div class="muted small">배부일 ${dateFmt(o.distribution_date)} · 신청 마감 ${timeFmt(o.deadline)}</div></div>${live?'<span class="tag">신청 중</span>':'<span class="tag yellow">신청 마감</span>'}</div><div style="margin-top:14px">${imageHtml(o)}</div></div>
  <div class="card"><h2>간식 신청</h2>${renderPickers('teacher','applyType','otherGroup','targetKey',o,'teacher')}
  ${!key?'<div class="note info">신청할 선생님을 선택해주세요.</div>':status&&!own?`<div class="note warn">이미 ${esc(status.requested_by_name)} 교사가 신청했습니다. 신청 변경은 해당 교사 또는 간식 담당자에게 요청해주세요.</div>`:!live?'<div class="note warn">신청 기간이 종료되어 새로운 신청이나 변경을 할 수 없습니다.</div>':`<div class="divider"></div>${(o.catalog||[]).map(sec=>`<div class="menu-card"><h3>${esc(sec.title)} <span class="muted small">(최대 1개)</span></h3><div class="options"><label class="option ${!selected[sec.id]?'active':''}"><input type="radio" name="pick_${esc(sec.id)}" data-section="${esc(sec.id)}" value="" ${!selected[sec.id]?'checked':''}><span>선택 안 함</span></label>${sec.items.map(m=>`<label class="option ${selected[sec.id]===m.id?'active':''}"><input type="radio" name="pick_${esc(sec.id)}" data-section="${esc(sec.id)}" value="${esc(m.id)}" ${selected[sec.id]===m.id?'checked':''}><span>${esc(m.name)}</span><b>${money(m.price)}</b></label>`).join('')}</div></div>`).join('')}

async function encodeImage(file){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('이미지 파일만 등록해주세요.');
  const bitmap=await createImageBitmap(file),limit=1800,scale=Math.min(1,limit/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));if(!blob||blob.size>3*1024*1024)throw Error('사진 용량을 줄인 뒤 다시 시도해주세요. (3MB 이하)');
  return {mime:'image/jpeg',imageBase64:await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(String(rd.result).split(',')[1]);rd.onerror=()=>reject(Error('사진 읽기에 실패했습니다.'));rd.readAsDataURL(blob);})};
}
async function uploadImage(orderId,file){const photo=await encodeImage(file);if(photo)await api('manager_upload_image',{orderId,...photo},true);}

async function createNewOrder(){const btn=$('#createNewOrder');btn.disabled=true;try{const outlet=$('#newOutlet').value,distributionDate=$('#newDist').value,rawDeadline=$('#newDeadline').value,photo=$('#newOrderPhoto').files?.[0];const catalog=sanitizedCatalog('newCatalog');if(!outlet.trim()||!distributionDate||!rawDeadline)throw Error('주문처·배부일·마감시간을 모두 입력해주세요.');const d=new Date(rawDeadline);if(Number.isNaN(d.getTime()))throw Error('마감시간을 확인해주세요.');if(!confirm('새 간식 신청을 시작할까요?')){btn.disabled=false;return;}

  // 담당자 현황만 30초 간격으로 새로고침. 입력 중에는 갱신하지 않습니다.
  setInterval(async()=>{if(document.hidden||S.loading||S.mode!=='manager'||!S.managerPw||S.editingOrder||S.editingMeal||S.entryEditKey||S.mealEditKey||$('#manager')?.contains(document.activeElement))return;try{await loadManager();renderManager()}catch(e){notify(e.message,'bad')}},30000);
}
initialize();
</script></body></html>
