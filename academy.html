<style>
:root{--dark:#334155;--ink:#1f2937;--muted:#64748b;--line:#dde4ed;--bg:#f5f7fa;--white:#fff;--blue:#eff6ff;--radius:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{text-decoration:none;color:inherit}
.app{max-width:1210px;margin:auto;padding:22px 18px 38px}.head{background:#fff;padding:21px 24px;border:1px solid var(--line);border-radius:17px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 18px #17233408}.head h1{font-size:24px;margin:0 0 3px;letter-spacing:-.04em}.head p{color:var(--muted);font-size:13px;margin:0}.head-right{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 13px;border-radius:9px;font-weight:700;border:1px solid transparent;background:#fff;color:var(--dark)}.btn.main{background:var(--dark);color:#fff}.btn.soft{background:#e9eef3;color:var(--dark)}.btn.outline{border-color:var(--line)}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.green{background:#dcfce7;color:#166534}.btn.sm{padding:6px 9px;font-size:12px}.btn.full{width:100%}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.nav button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:11px 17px;font-weight:800}.nav button.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin:0 0 15px;box-shadow:0 3px 15px #17233408}.card h2{font-size:19px;margin:0 0 10px}.card h3{font-size:16px;margin:0 0 10px}.card .hint,.hint{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.field{display:block;font-size:13px;font-weight:800;margin:0 0 5px}.input,.select{width:100%;min-width:0;background:#fff;border:1px solid #cdd6e0;border-radius:9px;padding:10px 12px;outline:0}.input:focus,.select:focus{border-color:#64748b;box-shadow:0 0 0 3px #e2e8f0}.formpart{margin-bottom:15px}.filter-ages,.filter-classes{display:flex;gap:7px;flex-wrap:wrap}.filter-ages button,.filter-classes button{padding:8px 13px;border:1px solid #d3dce6;border-radius:9px;background:#fff;color:var(--dark);font-weight:700}.filter-ages button.selected,.filter-classes button.selected{background:var(--dark);border-color:var(--dark);color:#fff}.filter-classes{border-top:1px solid #edf0f5;margin-top:12px;padding-top:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:210px}
.info{padding:11px 13px;background:#eff6ff;color:#1e40af;border-radius:11px;font-size:13px;margin:10px 0}.ok{background:#ecfdf5;color:#166534}.warning{background:#fff7ed;color:#92400e}.error{background:#fef2f2;color:#991b1b}.hide{display:none!important}.empty{padding:30px 14px;border:1px dashed #cbd5e1;border-radius:13px;text-align:center;color:var(--muted)}.pill{display:inline-block;border-radius:99px;background:#f1f5f9;color:#475569;padding:2px 9px;font-weight:800;font-size:11px}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{background:white;border:1px solid var(--line);padding:13px 15px;border-radius:12px}.stat small{display:block;color:var(--muted)}.stat b{font-size:23px}
.center-card{margin-bottom:14px;background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.center-head{padding:14px 16px;background:#f9fafb;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}.center-head strong{font-size:16px}.center-head .contacts{color:var(--muted);font-size:12px}.tablewrap{width:100%;overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{border-bottom:1px solid #edf0f4;padding:9px;text-align:center;font-size:12px}th{color:#59677b;background:#f8fafc;font-weight:800}tr:last-child td{border-bottom:0}.child-mask{font-size:13px;font-weight:800;letter-spacing:.02em}.time{display:block;font-size:11px;color:var(--muted)}.row-actions{display:flex;align-items:center;gap:5px;justify-content:center;flex-wrap:wrap}
.manager-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.manager-nav button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 13px;font-weight:700;color:var(--dark)}.manager-nav button.active{background:#e2e8f0}.center-management{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.history-search{max-width:390px}.day-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.day-item{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px}.day-item label{display:flex;gap:6px;align-items:center;font-weight:700;margin-bottom:8px}.day-item input[type=time]{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:7px}.foot{text-align:center;color:#64748b;padding:12px 0;font-size:12px}
.overlay{position:fixed;inset:0;z-index:1000;background:#141f2d88;display:flex;align-items:center;justify-content:center;padding:15px;overflow-y:auto}.dialog{width:min(650px,100%);max-height:calc(100vh - 30px);overflow-y:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 50px #0f172a33}.dialog h2{margin:0 0 14px;font-size:20px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;border-top:1px solid var(--line);padding-top:15px}
@media(max-width:760px){.app{padding:12px}.head{padding:17px}.head h1{font-size:20px}.card{padding:14px}.layout,.stat-grid{grid-template-columns:1fr}.day-grid{grid-template-columns:1fr 1fr}.center-head{align-items:flex-start}.dialog{padding:15px}.nav{display:grid;grid-template-columns:1fr 1fr}.nav button{font-size:13px;padding:9px}}

<body>
<div class="app">
<header class="head"><div><h1>🎒 학원 귀가 비상연락망</h1><p>학급별·학원별 귀가 일정과 비상연락처를 안전하게 확인합니다.</p></div>
<div class="head-right"><button id="refreshBtn" class="btn soft">↻ 새로고침</button><a class="btn outline" href="index.html">⌂ 통합포털 홈</a></div></header>
<div id="globalMessage"></div><p class="hint" id="accountInfo"></p>
<nav class="nav"><button class="active" id="tabHome">전체 현황</button><button id="tabManager">담당자 관리</button><button id="tabSettings" class="hide">관리자 설정</button></nav>
<section id="homeArea"></section><section id="managerArea" class="hide"></section><section id="settingsArea" class="hide"></section>
<div class="foot">아동 이름은 현황에 마스킹 표시됩니다. 업무상 필요한 범위에서만 조회·수정하고, 공용 기기에서 사용 후에는 통합포털에서 로그아웃하세요.</div>
</div>
<div id="modalHost"></div>
<script>
'use strict';
const SUPABASE_URL='https://vohcugxfwxdvkbcpjcgl.supabase.co';
const SUPABASE_PUBLIC_KEY='sb_publishable_Q0cXaglzBaz9Py2oct_NTQ_vMHsUeSQ';
const API_URL=SUPABASE_URL+'/functions/v1/academy-api';
const CLASS_GROUPS=[{age:'만 2세',classes:['예빛반','봄빛반','물빛반','꿈빛반']},{age:'만 3세',classes:['한빛반','은빛반','새빛반']},{age:'만 4세',classes:['윤빛반','꽃빛반']},{age:'만 5세',classes:['들빛반','솔빛반']}];
const ALL_CLASSES=CLASS_GROUPS.flatMap(g=>g.classes);
const WEEKDAYS=[{key:'mon',label:'월'},{key:'tue',label:'화'},{key:'wed',label:'수'},{key:'thu',label:'목'},{key:'fri',label:'금'}];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtDate=s=>s?new Date(s).toLocaleDateString('ko-KR'):'—';
const fmtTime=s=>s?new Date(s).toLocaleString('ko-KR'):'—';
const S={credential:null,user:null,isAdmin:false,managerConfigured:false,managerPin:'',centers:[],children:[],managerChildren:[],history:[],mode:'home',managerMode:'children',age:'전체',cls:'전체',search:'',busy:false,lastUpdated:''};
function portalLogin(){for(const key of ['libraryCurrentUser','materialsCurrentUser','consumablesCurrentUser','childRightsCurrentUser']){try{const row=JSON.parse(localStorage.getItem(key)||'null');if(row?.id&&typeof row.password==='string'&&row.password)return {id:row.id,password:row.password}}catch{}}return null}
function banner(message,kind='info'){$('#globalMessage').innerHTML=message?`<div class="info ${kind}">${esc(message)}</div>`:''}
async function api(action,body={},manager=false){if(!S.credential)throw Error('통합포털에서 로그인한 후 이용해주세요.');
 let response;try{response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_PUBLIC_KEY},body:JSON.stringify({action,credential:S.credential,...body,...(manager?{managerPin:S.managerPin}:{})}),cache:'no-store'})}catch{throw Error('학원 귀가 서버에 연결하지 못했습니다. Edge Function 배포·인터넷 연결을 확인해주세요.')}
 let result;try{result=await response.json()}catch{throw Error('서버 응답을 확인할 수 없습니다. Edge Function 설정을 확인해주세요.')}
 if(!response.ok)throw Error(result?.error||`서버 오류 (${response.status})`);return result}
function setMode(mode){if(mode==='settings'&&!S.isAdmin)return;S.mode=mode;for(const name of ['home','manager','settings']){const tab=$('#tab'+name[0].toUpperCase()+name.slice(1));tab.classList.toggle('active',name===mode);$('#'+name+'Area').classList.toggle('hide',name!==mode)}renderMode()}
function renderMode(){if(S.mode==='home')renderHome();if(S.mode==='manager')renderManager();if(S.mode==='settings')renderSettings()}
function renderLoginNeeded(){banner('통합포털에 로그인해야 이용할 수 있습니다.','warning');$('#homeArea').innerHTML='<div class="card"><div class="empty"><a class="btn main" href="index.html">통합포털 로그인 화면으로 이동</a></div></div>'}
async function bootstrap(silent=false){if(S.busy)return;S.busy=true;try{const data=await api('bootstrap');S.user=data.user;S.isAdmin=data.isAdmin;S.managerConfigured=data.managerConfigured;S.centers=data.centers||[];S.children=data.children||[];S.lastUpdated=data.lastUpdated||'';$('#accountInfo').textContent=`접속 교직원: ${S.user.name} / ${S.user.class_name}${S.lastUpdated?' · 아동 자료 최근 수정 '+fmtTime(S.lastUpdated):''}`;$('#tabSettings').classList.toggle('hide',!S.isAdmin);if(S.managerPin)await managerData();if(!silent)banner('최신 자료로 새로고침했습니다.','ok');renderMode()}catch(e){banner(e.message,'error');if(/로그인/.test(e.message))renderLoginNeeded()}finally{S.busy=false}}
async function managerData(){if(!S.managerPin)return;try{const data=await api('manager_data',{},true);S.centers=data.centers||[];S.managerChildren=data.children||[];S.history=data.history||[]}catch(e){if(/비밀번호|15분|설정해야/.test(e.message)){S.managerPin='';S.managerChildren=[];S.history=[]}throw e}}
async function refreshAll(){await bootstrap(true);if(S.managerPin)await managerData();renderMode()}
function ageOf(cls){return CLASS_GROUPS.find(g=>g.classes.includes(cls))?.age||''}
function formatSchedule(schedule){return WEEKDAYS.map(d=>schedule?.[d.key]?.enabled?`${d.label} ${schedule[d.key].time}`:null).filter(Boolean).join(' / ')||'—'}
function ageButtons(){return ['전체',...CLASS_GROUPS.map(g=>g.age)].map(a=>`<button class="${S.age===a?'selected':''}" data-age="${esc(a)}">${esc(a)}</button>`).join('')}
function classButtons(){if(S.age==='전체')return'';let c=CLASS_GROUPS.find(g=>g.age===S.age)?.classes||[];return `<div class="filter-classes">${['전체',...c].map(name=>`<button class="${S.cls===name?'selected':''}" data-class="${esc(name)}">${name==='전체'?'전체 반':esc(name)}</button>`).join('')}</div>`}
function filteredChildren(){let list=S.children.filter(c=>(S.age==='전체'||ageOf(c.class_name)===S.age)&&(S.cls==='전체'||c.class_name===S.cls));let q=S.search.trim().toLowerCase();if(q)list=list.filter(c=>{const acad=S.centers.find(x=>x.id===c.academy_id);return [c.display_name,c.can_edit?c.full_name:'',c.class_name,acad?.name||''].some(s=>String(s||'').toLowerCase().includes(q))});return list}
function renderHome(){if(!S.user)return;let list=filteredChildren(),canRegister=ALL_CLASSES.includes(S.user.class_name);
 $('#homeArea').innerHTML=`<div class="card"><div class="between"><h2>학급별 조회</h2><span class="hint">만 2~5세 · 연령 선택 후 반 선택</span></div><div class="filter-ages">${ageButtons()}</div>${classButtons()}</div>
 <div class="card"><div class="toolbar"><input class="input" id="search" placeholder="아동 이름(표시명) · 자기 반 이름 · 학원명 검색" value="${esc(S.search)}"><button id="searchClear" class="btn outline sm">검색 초기화</button>${canRegister?'<button id="teacherAdd" class="btn main">+ 우리 반 아동 등록</button>':''}</div><div class="hint" style="margin-top:8px">전체 현황의 이름은 개인정보 보호를 위해 마스킹됩니다. 수정할 때는 담당 반의 원래 이름만 확인됩니다.</div></div>
 <div class="stat-grid"><div class="stat"><small>조회 대상 아동</small><b>${list.length}명</b></div><div class="stat"><small>등록된 학원</small><b>${new Set(list.map(c=>c.academy_id)).size}곳</b></div><div class="stat"><small>선택 범위</small><b style="font-size:15px">${esc(S.age==='전체'?'전체 연령':S.age)} ${S.cls==='전체'?'':`· ${esc(S.cls)}`}</b></div></div>
 <div id="statusTables">${renderStatusTables(list)}</div>`;
 $$('[data-age]').forEach(b=>b.onclick=()=>{S.age=b.dataset.age;S.cls='전체';renderHome()});$$('[data-class]').forEach(b=>b.onclick=()=>{S.cls=b.dataset.class;renderHome()});
 $('#search').oninput=e=>{S.search=e.target.value;const list=filteredChildren();$('#statusTables').innerHTML=renderStatusTables(list);const stats=$$('.stat b');if(stats[0])stats[0].textContent=list.length+'명';if(stats[1])stats[1].textContent=new Set(list.map(x=>x.academy_id)).size+'곳';bindTeacherEdits()};
 $('#searchClear').onclick=()=>{S.search='';renderHome()};if($('#teacherAdd'))$('#teacherAdd').onclick=()=>openChildEditor(false,null);
 bindTeacherEdits()}
function renderStatusTables(list){if(!list.length)return '<div class="card"><div class="empty">해당 조건에 등록된 귀가 아동이 없습니다.</div></div>';
 const ids=[...new Set(list.map(c=>c.academy_id))];return ids.map(id=>{const a=S.centers.find(v=>v.id===id),entries=list.filter(c=>c.academy_id===id).sort((x,y)=>ALL_CLASSES.indexOf(x.class_name)-ALL_CLASSES.indexOf(y.class_name)||x.display_name.localeCompare(y.display_name,'ko'));
 return `<section class="center-card"><div class="center-head"><strong>🏫 ${esc(a?.name||'등록되지 않은 학원')} <span class="pill">${entries.length}명</span></strong><div class="contacts">☎ 학원 ${esc(a?.phone||'—')} · 귀가 담당자 ${esc(a?.pickup_phone||'—')}</div></div><div class="tablewrap"><table><thead><tr><th>반</th><th>아동</th>${WEEKDAYS.map(d=>`<th>${d.label}</th>`).join('')}<th>수정</th></tr></thead><tbody>${entries.map(c=>`<tr><td>${esc(c.class_name)}</td><td class="child-mask">${esc(c.display_name)}</td>${WEEKDAYS.map(d=>`<td>${c.pickup_schedule?.[d.key]?.enabled?`✓<span class="time">${esc(c.pickup_schedule[d.key].time)}</span>`:'—'}</td>`).join('')}<td>${c.can_edit?`<button class="btn soft sm" data-teacher-edit="${c.id}">수정</button>`:'<span class="hint">—</span>'}</td></tr>`).join('')}</tbody></table></div></section>`}).join('')}
function bindTeacherEdits(){$$('[data-teacher-edit]').forEach(b=>b.onclick=()=>openChildEditor(false,b.dataset.teacherEdit))}
function renderSettings(){if(!S.isAdmin)return;$('#settingsArea').innerHTML=`<div class="card" style="max-width:610px"><h2>🔐 담당자 비밀번호 ${S.managerConfigured?'변경':'최초 설정'}</h2><p class="hint">통합포털 관리자만 설정·변경할 수 있습니다. 학원·이력 담당자에게 번호를 전달하면 별도 권한 부여가 필요하지 않습니다.</p><div class="info warning">숫자 4자리 비밀번호는 보안 수준이 낮습니다. 예측 가능한 번호를 피하고 담당자가 바뀌면 즉시 변경해주세요.</div><div class="formpart"><label class="field" for="pinNew">새 비밀번호 (숫자 4자리)</label><input id="pinNew" class="input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password"></div><div class="formpart"><label class="field" for="pinAgain">새 비밀번호 확인</label><input id="pinAgain" class="input" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div><button id="pinSet" class="btn main">${S.managerConfigured?'비밀번호 변경':'비밀번호 설정'}</button></div>`;
 $('#pinSet').onclick=async()=>{const pin=$('#pinNew').value;if(!/^\d{4}$/.test(pin))return alert('숫자 4자리를 입력해주세요.');if(pin!==$('#pinAgain').value)return alert('비밀번호 확인이 일치하지 않습니다.');if(!confirm('담당자 비밀번호를 설정·변경할까요?'))return;const b=$('#pinSet');b.disabled=true;try{await api('admin_set_pin',{newPin:pin});S.managerConfigured=true;S.managerPin='';S.managerChildren=[];S.history=[];banner('비밀번호가 저장되었습니다. 담당자에게 새 비밀번호를 안내해주세요.','ok');renderSettings()}catch(e){banner(e.message,'error')}finally{b.disabled=false}}}
function renderManager(){if(!S.user)return;if(!S.managerConfigured){$('#managerArea').innerHTML='<div class="card"><div class="empty">담당자 비밀번호가 아직 설정되지 않았습니다. 통합포털 관리자가 관리자 설정에서 먼저 설정해주세요.</div></div>';return}
 if(!S.managerPin){$('#managerArea').innerHTML=`<div class="card" style="max-width:510px;margin:0 auto"><h2>🔐 담당자 로그인</h2><p class="hint">학원·이력 관리 담당자 전용 비밀번호를 입력해주세요.</p><input type="password" id="managerPinInput" class="input" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" autocomplete="off"><button id="managerUnlock" class="btn main full" style="margin-top:12px">담당자 관리 열기</button><div class="hint" style="margin-top:10px">비밀번호 오류 5회 시 15분 동안 해당 계정의 담당자 접근이 제한됩니다.</div></div>`;
 $('#managerUnlock').onclick=async()=>{let pin=$('#managerPinInput').value;if(!/^\d{4}$/.test(pin))return alert('숫자 4자리를 입력해주세요.');const btn=$('#managerUnlock');btn.disabled=true;try{await api('manager_login',{managerPin:pin});S.managerPin=pin;await managerData();banner('담당자 관리 화면을 열었습니다.','ok');renderManager()}catch(e){S.managerPin='';banner(e.message,'error')}finally{btn.disabled=false}};$('#managerPinInput').onkeydown=e=>{if(e.key==='Enter')$('#managerUnlock').click()};return}
 $('#managerArea').innerHTML=`<div class="card"><div class="between"><div><h2>담당자 관리</h2><p class="hint">전체 아동 수정 · 학원 관리 · 이력 관리</p></div><button class="btn soft sm" id="managerLock">🔒 관리 잠금</button></div><div class="manager-nav">${[{key:'children',title:'전체 아동 관리'},{key:'centers',title:'학원 관리'},{key:'history',title:'이력 관리'}].map(m=>`<button class="${S.managerMode===m.key?'active':''}" data-manager-page="${m.key}">${m.title}</button>`).join('')}</div><div id="managerContent"></div></div>`;
 $('#managerLock').onclick=()=>{S.managerPin='';S.managerChildren=[];S.history=[];banner('담당자 관리 화면을 잠갔습니다.','ok');renderManager()};$$('[data-manager-page]').forEach(b=>b.onclick=()=>{S.managerMode=b.dataset.managerPage;renderManager()});renderManagerContent()}
function renderManagerContent(){const root=$('#managerContent');if(!root)return;
 if(S.managerMode==='children'){
  root.innerHTML=`<div class="between" style="margin:10px 0"><h3>전체 귀가 아동 ${S.managerChildren.length}명</h3><button id="managerAddChild" class="btn main">+ 아동 등록</button></div><div class="tablewrap"><table><thead><tr><th>연령/반</th><th>아동 이름 (담당자)</th><th>학원</th><th>픽업 일정</th><th>처리</th></tr></thead><tbody>${S.managerChildren.slice().sort((a,b)=>ALL_CLASSES.indexOf(a.class_name)-ALL_CLASSES.indexOf(b.class_name)||a.child_name.localeCompare(b.child_name,'ko')).map(c=>{let a=S.centers.find(v=>v.id===c.academy_id);return `<tr><td>${esc(c.class_name)}</td><td><b>${esc(c.child_name)}</b></td><td>${esc(a?.name||'미등록')}</td><td>${esc(formatSchedule(c.pickup_schedule))}</td><td><span class="row-actions"><button class="btn soft sm" data-meditchild="${c.id}">수정</button><button class="btn danger sm" data-archive="${c.id}">이력 이동</button></span></td></tr>`}).join('')||'<tr><td colspan="5">등록된 아동이 없습니다.</td></tr>'}</tbody></table></div>`;
  $('#managerAddChild').onclick=()=>openChildEditor(true,null);
  $$('[data-meditchild]').forEach(b=>b.onclick=()=>openChildEditor(true,b.dataset.meditchild));
  $$('[data-archive]').forEach(b=>b.onclick=async()=>{const row=S.managerChildren.find(c=>c.id===b.dataset.archive);if(!row||!confirm(`${row.child_name} 아동을 현황에서 제외하고 이력 관리로 이동할까요?`))return;await runManagerAction('manager_archive_child',{childId:row.id},'아동을 이력 관리로 이동했습니다.')});
 } else if(S.managerMode==='centers'){
  root.innerHTML=`<div class="between" style="margin:10px 0"><h3>등록 학원 ${S.centers.length}곳</h3><button id="managerAddCenter" class="btn main">+ 학원 추가</button></div>${S.centers.map(a=>`<div class="center-management between"><div><strong>${esc(a.name)}</strong><div class="hint">학원 ${esc(a.phone)} · 귀가 담당자 ${esc(a.pickup_phone)}</div></div><div class="row"><button class="btn soft sm" data-editcenter="${a.id}">수정</button><button class="btn danger sm" data-delcenter="${a.id}">삭제</button></div></div>`).join('')||'<div class="empty">학원 목록이 없습니다.</div>'}`;
  $('#managerAddCenter').onclick=()=>openCenterEditor(null);$$('[data-editcenter]').forEach(b=>b.onclick=()=>openCenterEditor(b.dataset.editcenter));
  $$('[data-delcenter]').forEach(b=>b.onclick=async()=>{const a=S.centers.find(x=>x.id===b.dataset.delcenter);if(!a||!confirm(`'${a.name}' 학원을 삭제할까요?\n현재 이용 아동이 있는 학원은 삭제할 수 없습니다.`))return;await runManagerAction('manager_delete_center',{centerId:a.id},'학원 정보를 삭제했습니다.')});
 } else {
  root.innerHTML=`<h3>과거 이력 ${S.history.length}건</h3><p class="hint">현재 귀가 현황에서 제외된 아동 기록입니다. 개인정보 보관 기간을 정하고 만료된 이력은 삭제해주세요.</p><input id="historySearch" class="input history-search" placeholder="아동 이름 / 학원 / 반 검색"><div id="historyTable"></div>`;$('#historySearch').oninput=renderHistory;renderHistory();
 }}
function renderHistory(){let root=$('#historyTable');if(!root)return;let q=$('#historySearch')?.value.trim().toLowerCase()||'';let rs=S.history.filter(c=>[c.child_name,c.class_name,c.archived_academy_name||'',S.centers.find(a=>a.id===c.academy_id)?.name||''].some(v=>String(v).toLowerCase().includes(q))).sort((a,b)=>String(b.archived_at).localeCompare(String(a.archived_at)));
 root.innerHTML=`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>반</th><th>아동 이름</th><th>학원</th><th>픽업 일정</th><th>이력 이동일</th><th>관리</th></tr></thead><tbody>${rs.map(c=>`<tr><td>${esc(c.class_name)}</td><td>${esc(c.child_name)}</td><td>${esc(c.archived_academy_name||S.centers.find(a=>a.id===c.academy_id)?.name||'미등록')}</td><td>${esc(formatSchedule(c.pickup_schedule))}</td><td>${fmtDate(c.archived_at)}</td><td><span class="row-actions"><button class="btn soft sm" data-restore="${c.id}">복구</button><button class="btn danger sm" data-delete-history="${c.id}">영구 삭제</button></span></td></tr>`).join('')||'<tr><td colspan="6">보관된 이력이 없습니다.</td></tr>'}</tbody></table></div>`;
 $$('[data-restore]').forEach(b=>b.onclick=async()=>{let c=S.history.find(x=>x.id===b.dataset.restore);if(!c||!confirm(`${c.child_name} 아동을 현재 목록으로 복구할까요?`))return;await runManagerAction('manager_restore_child',{childId:c.id},'이력을 현재 목록으로 복구했습니다.')});
 $$('[data-delete-history]').forEach(b=>b.onclick=async()=>{let c=S.history.find(x=>x.id===b.dataset.deleteHistory);if(!c||!confirm(`${c.child_name} 아동의 이력을 영구 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`)||!confirm('정말 영구 삭제하시겠습니까?'))return;await runManagerAction('manager_delete_history',{childId:c.id},'이력 기록을 영구 삭제했습니다.')})}
async function runManagerAction(action,payload,success){try{await api(action,payload,true);await managerData();await bootstrap(true);banner(success,'ok');renderMode()}catch(e){banner(e.message,'error');renderMode()}}
function centerOptions(selected=''){return '<option value="">학원을 선택해주세요.</option>'+S.centers.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(a=>`<option value="${a.id}" ${selected===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}
function classOptions(selected=''){return CLASS_GROUPS.map(g=>`<optgroup label="${g.age}">${g.classes.map(cls=>`<option value="${cls}" ${selected===cls?'selected':''}>${cls}</option>`).join('')}</optgroup>`).join('')}
function openChildEditor(manager=false,id=null){let row=manager?S.managerChildren.find(c=>c.id===id):S.children.find(c=>c.id===id);if(id&&!row)return alert('아동 정보를 찾을 수 없습니다.');if(!manager&&(!ALL_CLASSES.includes(S.user?.class_name)||row&&!row.can_edit))return alert('자기 반 아동만 등록·수정할 수 있습니다.');
 const schedule=row?.pickup_schedule||{};const name=manager?row?.child_name||'':row?.full_name||'';
 $('#modalHost').innerHTML=`<div class="overlay" id="editorOverlay"><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2>${id?'학원 귀가 아동 수정':'학원 귀가 아동 등록'}</h2><button id="closeEditorX" class="btn outline">✕</button></div><p class="hint">${manager?'담당자는 모든 반의 아동 정보를 관리할 수 있습니다.':'통합포털 계정의 담당 반 아동만 등록·수정할 수 있습니다.'}</p><form id="childForm">
 <div class="formpart"><label class="field" for="childClass">학급</label>${manager?`<select id="childClass" class="select" required>${classOptions(row?.class_name||'')}</select>`:`<input class="input" value="${esc(S.user.class_name)}" disabled>`}</div>
 <div class="formpart"><label class="field" for="childName">아동 이름 (원래 이름)</label><input id="childName" class="input" maxlength="30" required value="${esc(name)}" placeholder="예: 김혜인"><p class="hint">현황에는 자동으로 김○인 형태로 표시됩니다.</p></div>
 <div class="formpart"><label class="field" for="childAcademy">이용 학원</label><select id="childAcademy" class="select" required>${centerOptions(row?.academy_id||'')}</select>${!S.centers.length?'<p class="info warning">등록된 학원이 없습니다. 담당자에게 학원 등록을 요청해주세요.</p>':''}</div>
 <div class="formpart"><label class="field">픽업 요일 및 시간</label><div class="day-grid">${WEEKDAYS.map(d=>{const on=schedule?.[d.key]?.enabled===true;return `<div class="day-item"><label><input type="checkbox" data-day-check="${d.key}" ${on?'checked':''}> ${d.label}요일</label><input class="input" type="time" data-day-time="${d.key}" value="${esc(on?schedule[d.key].time:'')}" ${on?'':'disabled'}></div>`}).join('')}</div></div>
 <div class="dialog-foot"><button type="button" id="closeEditor" class="btn outline">취소</button><button type="submit" id="saveChildBtn" class="btn main">저장</button></div></form></div></div>`;
 $('#closeEditor').onclick=closeEditor;$('#closeEditorX').onclick=closeEditor;$$('[data-day-check]').forEach(x=>x.onchange=()=>{const input=$(`[data-day-time="${x.dataset.dayCheck}"]`);input.disabled=!x.checked;if(!x.checked)input.value='' });
 $('#childForm').onsubmit=async e=>{e.preventDefault();const timeEntries={};let selected=0;for(const d of WEEKDAYS){const checked=$(`[data-day-check="${d.key}"]`).checked,time=$(`[data-day-time="${d.key}"]`).value;timeEntries[d.key]={enabled:checked,time:checked?time:''};if(checked){selected++;if(!time)return alert('선택한 요일에 픽업 시간을 입력해주세요.')}}if(!selected)return alert('픽업 요일을 하나 이상 선택해주세요.');
 const payload={childId:id||undefined,className:manager?$('#childClass').value:S.user.class_name,childName:$('#childName').value,academyId:$('#childAcademy').value,schedule:timeEntries};const btn=$('#saveChildBtn');btn.disabled=true;
 try{await api(manager?'manager_save_child':'teacher_save_child',payload,manager);closeEditor();if(manager)await managerData();await bootstrap(true);banner('아동 귀가 정보가 저장되었습니다.','ok');renderMode()}catch(err){alert(err.message);banner(err.message,'error')}finally{btn.disabled=false}}}
function openCenterEditor(id){if(!S.managerPin)return;let a=S.centers.find(c=>c.id===id);
 $('#modalHost').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2>${id?'학원 정보 수정':'새 학원 추가'}</h2><button class="btn outline" id="closeEditorX">✕</button></div><form id="centerForm"><div class="formpart"><label class="field">학원 이름</label><input class="input" id="centerName" maxlength="80" required value="${esc(a?.name||'')}"></div><div class="formpart"><label class="field">학원 전화번호</label><input class="input" id="centerPhone" type="tel" maxlength="30" required value="${esc(a?.phone||'')}"></div><div class="formpart"><label class="field">학원 귀가 담당자 전화번호</label><input class="input" id="centerPickupPhone" type="tel" maxlength="30" required value="${esc(a?.pickup_phone||'')}"></div><div class="dialog-foot"><button type="button" class="btn outline" id="closeEditor">취소</button><button type="submit" id="saveCenterBtn" class="btn main">저장</button></div></form></div></div>`;
 $('#closeEditor').onclick=closeEditor;$('#closeEditorX').onclick=closeEditor;$('#centerForm').onsubmit=async e=>{e.preventDefault();const btn=$('#saveCenterBtn');btn.disabled=true;try{await api('manager_save_center',{centerId:id||undefined,name:$('#centerName').value,phone:$('#centerPhone').value,pickupPhone:$('#centerPickupPhone').value},true);closeEditor();await managerData();await bootstrap(true);banner('학원 정보를 저장했습니다.','ok');renderMode()}catch(e){alert(e.message);banner(e.message,'error')}finally{btn.disabled=false}}}
function closeEditor(){$('#modalHost').innerHTML=''}
$('#tabHome').onclick=()=>setMode('home');$('#tabManager').onclick=()=>setMode('manager');$('#tabSettings').onclick=()=>setMode('settings');
$('#refreshBtn').onclick=async()=>{try{await bootstrap(false)}catch(e){banner(e.message,'error')}};
(async()=>{S.credential=portalLogin();if(!S.credential){renderLoginNeeded();return}await bootstrap(true);setInterval(async()=>{if(document.hidden||S.busy||$('#modalHost').children.length||document.activeElement?.tagName==='INPUT'||document.activeElement?.tagName==='SELECT')return;try{await bootstrap(true)}catch{}},30000)})();
</script>
</body>
</html>
