async function fetchWithRetry(input, init={}){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 5000);

  try{
    return await fetch(input, {
      ...init,
      signal:controller.signal
    });
  }finally{
    clearTimeout(timeout);
  }
}

const supabaseClient = supabase.createClient(

  {global:{fetch:(input, init)=>fetchWithRetry(input, init)}}
);

function getSavedPortalUser(){
  for(const key of PORTAL_LOGIN_KEYS){
    const raw = localStorage.getItem(key);
    if(!raw) continue;
    try{
      return JSON.parse(raw);
    }catch(error){
      console.warn("로그인 정보 해석 실패:", error);
    }
  }
  return null;
}

function savePortalUser(user){
  PORTAL_LOGIN_KEYS.forEach(key=>{
    localStorage.setItem(key, JSON.stringify(user));
  });
}

function showAccessDenied(message){
  document.getElementById("accessMessage").textContent = message;
  document.getElementById("portalReturnBtn").classList.remove("hidden");
}

function withTimeout(promise, milliseconds=8000){
  return Promise.race([
    promise,
    new Promise((_, reject)=>{
      setTimeout(()=>reject(new Error("권한 확인 시간이 초과되었습니다.")), milliseconds);
    })
  ]);
}

async function fetchPortalUser(savedUser){
  let result = await withTimeout(
    supabaseClient
      .from("users")
      .select("*")
      .eq("id", savedUser.id)
      .maybeSingle(),
    8000
  );

  if(result.error) throw result.error;
  if(result.data) return result.data;

  if(savedUser.username){
    result = await withTimeout(
      supabaseClient
        .from("users")
        .select("*")
        .eq("username", savedUser.username)
        .maybeSingle(),
      8000
    );

    if(result.error) throw result.error;
    return result.data || null;
  }

  return null;
}

async function verifyAdminAccess(){
  const savedUser = getSavedPortalUser();
  const messageEl = document.getElementById("accessMessage");

  if(!savedUser?.id){
    showAccessDenied("통합포털 로그인이 필요합니다. 포털에서 로그인한 뒤 다시 이용해주세요.");
    return false;
  }

  messageEl.textContent = "로그인 정보를 확인했습니다. 관리자 권한을 조회하고 있습니다.";

  try{
    const data = await fetchPortalUser(savedUser);

    if(!data){
      showAccessDenied("사용자 정보를 확인할 수 없습니다. 통합포털에서 로그아웃한 뒤 다시 로그인해주세요.");
      return false;
    }

    if(data.approval_status !== "approved"){
      showAccessDenied("승인된 계정만 이용할 수 있습니다.");
      return false;
    }

    if(data.role !== "admin"){
      showAccessDenied("당직관리 시스템은 관리자만 이용할 수 있습니다.");
      return false;
    }

    dutyCurrentAdmin = data;
    savePortalUser(data);

    document.getElementById("dutyAdminInfo").textContent =
      `${data.name || data.username || "관리자"} 관리자`;

    document.getElementById("accessScreen").classList.add("hidden");
    document.getElementById("dutyApp").classList.remove("hidden");
    return true;
  }catch(error){
    console.error("관리자 권한 확인 실패:", error);
    showAccessDenied(
      `관리자 권한 확인에 실패했습니다.\n${error?.message || "알 수 없는 오류"}\n통합포털로 돌아가 다시 로그인한 뒤 시도해주세요.`
    );
    return false;
  }
}


function setConnectionStatus(message, state=""){
  const el = document.getElementById("connectionStatus");
  if(!el) return;
  el.textContent = message;
  el.className = "connection-status";
  if(state) el.classList.add(state);
}

function saveLocalCache(){

    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({
      teachers:teacherInput.value || DEFAULT_TEACHERS,
      leaves, holidays, eventExclusions, savedSchedules, eveningManagerCounts,
      cachedAt:new Date().toISOString()
    }));
  }catch(error){
    console.warn("로컬 캐시 저장 실패:", error);
  }
}

function loadLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(error){
    console.warn("로컬 캐시 불러오기 실패:", error);
    return null;
  }
}

async function saveAppData(key, value){
  const { error } = await supabaseClient
    .from("duty_app_data")
    .upsert(
      {
        id:key,
        data:value,
        updated_at:new Date().toISOString(),
        updated_by:dutyCurrentAdmin?.id || null,
        updated_by_name:dutyCurrentAdmin?.name || dutyCurrentAdmin?.username || null
      },
      {onConflict:"id"}
    );

  if(error){
    setConnectionStatus("공용 서버 저장 실패 · 현재 기기에만 임시 보관됩니다.", "offline");
    console.error("Supabase 저장 오류:", error);
    throw error;
  }

  saveLocalCache();
  setConnectionStatus("공용 서버 연결됨 · 다른 컴퓨터와 데이터가 공유됩니다.", "online");
  return true;
}

async function loadAppData(key){
  const { data, error } = await supabaseClient
    .from("duty_app_data")
    .select("*")
    .eq("id", key)
    .maybeSingle();

  if(error){
    console.error("Supabase 불러오기 오류:", error);
    throw error;
  }

  return data ? data.data : null;
}

async function loadAllSharedData(){

  leaves = cached?.leaves || [];
  holidays = cached?.holidays || [];
  eventExclusions = cached?.eventExclusions || [];

  renderHolidays();
  renderEventExclusions();
  renderSavedScheduleList();

  setConnectionStatus("화면 사용 가능 · 공용 서버 연결 확인 중...");

  try{
    const { data, error } = await supabaseClient
      .from("duty_app_data")
      .select("id,data,updated_at")
      .in("id", [
        "teachers","leaves","holidays","eventExclusions",
        "savedSchedules","eveningManagerCounts"
      ]);

    if(error) throw error;

    const map = {};
    (data || []).forEach(row=>{
      map[row.id] = row.data;
    });

    teacherInput.value = map.teachers || teacherInput.value || DEFAULT_TEACHERS;
    leaves = map.leaves || leaves;
    holidays = map.holidays || holidays;
    eventExclusions = map.eventExclusions || eventExclusions;
    savedSchedules = map.savedSchedules || savedSchedules;
    eveningManagerCounts = map.eveningManagerCounts || eveningManagerCounts;

    updateTeacherSelect();
    renderLeaveTeacherChecks();
    renderLeaves();
    renderHolidays();
    renderEventExclusions();
    renderSavedScheduleList();

    saveLocalCache();
    setConnectionStatus("공용 서버 연결됨 · 다른 컴퓨터와 데이터가 공유됩니다.", "online");
  }catch(error){
    console.error("공용 데이터 불러오기 실패:", error);

    const message =
      error?.name === "AbortError"
        ? "공용 서버 응답이 늦어 현재 기기 데이터로 실행 중입니다."
        : "공용 서버 연결 실패 · 현재 기기 데이터로 실행 중입니다.";

    setConnectionStatus(
      message + " 필요할 때 페이지를 새로고침하거나 저장목록 새로고침을 눌러주세요.",
      "offline"
    );
  }
}

function addMultipleLeaves(){
  const date = leaveDate.value;
  const checked = [...document.querySelectorAll(".leave-teacher-check:checked")];
  const names = checked.map(cb=>cb.value);

  if(!date) return alert("연차 날짜를 선택해줘.");
  if(names.length===0) return alert("연차 교사를 한 명 이상 체크해줘.");

  let addedCount = 0;
  let duplicateCount = 0;

  names.forEach(name=>{
    const exists = leaves.some(l=>l.date===date && l.teacher===name);

    if(exists){
      duplicateCount++;
      return;
    }

    leaves.push({date, teacher:name});
    addedCount++;
  });

  leaves.sort((a,b)=>
    a.date.localeCompare(b.date) ||
    a.teacher.localeCompare(b.teacher, "ko")
  );

  renderLeaves();
  saveLocalCache();
  selectAllLeaveTeachers(false);

  setLeaveSaveStatus(
    `화면에 ${addedCount}명 추가됨${duplicateCount ? ` · 중복 ${duplicateCount}명 제외` : ""}. 서버 저장 버튼을 눌러주세요.`,
    "saving"
  );
}

function getWeekday(date){
  return ["일","월","화","수","목","금","토"][date.getDay()];
}

function isHolidayDate(dateStr){
  return holidays.some(h=>h.date===dateStr);
}

function getPreviousDateStr(dateStr){
  const d = new Date(dateStr);
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function isWeekdayDate(dateStr){
  const d = new Date(dateStr);
  return d.getDay()>=1 && d.getDay()<=5;
}

function getPreviousWorkDateStr(dateStr){
  const d = new Date(dateStr);

  while(true){
    d.setDate(d.getDate()-1);
    const prev = d.toISOString().slice(0,10);
    const day = d.getDay();

    if(day>=1 && day<=5 && !isHolidayDate(prev)){
      return prev;
    }
  }
}

function getTeacherLeavePreviousFlexMap(){
  const map = {};
  leaves.forEach(l=>{
    const prev = getPreviousDateStr(l.date);
    if(isWeekdayDate(prev) && !isHolidayDate(prev)){
      map[`${prev}_${l.teacher}`] = true;
    }
  });
  return map;
}

function getMonthDates(monthValue){
  const [year, month] = monthValue.split("-").map(Number);
  const lastDay = new Date(year, month, 0).getDate();
  const dates = [];

  for(let d=1; d<=lastDay; d++){
    const date = new Date(year, month-1, d);
    const dateStr = `${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const weekday = getWeekday(date);
    const holiday = holidays.find(h=>h.date===dateStr);

    if(weekday !== "토" && weekday !== "일"){
      dates.push({
        dateStr,
        day:d,
        weekday,
        isHoliday:!!holiday,
        holidayReason:holiday ? holiday.reason : ""
      });
    }
  }
  return dates;
}

function getLeaveRoomsOnDate(dateStr, teachers){
  const leaveNames = leaves.filter(l=>l.date===dateStr).map(l=>l.teacher);
  return teachers.filter(t=>leaveNames.includes(t.name)).map(t=>t.room);
}

function nameHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){
    h = (h * 31 + str.charCodeAt(i)) % 1000;
  }
  return h / 1000;
}

function chooseTeacher(teachers, slot, dateStr){
  const unavailable = leaves.filter(l=>l.date===dateStr).map(l=>l.teacher);
  const eventUnavailable = eventExclusions.filter(e=>e.date===dateStr).map(e=>e.teacher);
  const alreadyAssignedToday = teachers.filter(t=>t.assignedDates.includes(dateStr));
  const flexMap = getTeacherLeavePreviousFlexMap();
  const leaveRooms = getLeaveRoomsOnDate(dateStr, teachers);
  const prevWorkDate = getPreviousWorkDateStr(dateStr);

  let candidates = teachers.filter(t=>{
    if(unavailable.includes(t.name)) return false;
    if(eventUnavailable.includes(t.name)) return false;
    if(t.assignedDates.includes(dateStr)) return false;

    if(t.assignedDates.includes(prevWorkDate)) return false;

    if(slot.type==="flex" && t.flexCount >= 3) return false;

    if(slot.type==="evening" && t.eveningManagerCountThisMonth > 0) return false;

    if(slot.type==="flex" && leaveRooms.includes(t.room)) return false;

    if(slot.type==="early7" || slot.type==="morningManager"){
      const sameRoomEarly = alreadyAssignedToday.some(x =>
        x.room===t.room && x.assignedEarly7Today===dateStr
      );
      if(sameRoomEarly) return false;
    }

    return true;
  });

  if(candidates.length===0){
    candidates = teachers.filter(t=>{
      if(unavailable.includes(t.name)) return false;
      if(eventUnavailable.includes(t.name)) return false;
      if(t.assignedDates.includes(dateStr)) return false;

      if(slot.type==="eveningManager" && t.eveningManagerCountThisMonth >= 1) return false;
      if(slot.type==="evening" && t.eveningManagerCountThisMonth > 0) return false;
      if(slot.type==="flex" && t.flexCount >= 3) return false;

      return true;
    });
  }

  if(candidates.length===0) return null;

  if(slot.type==="flex"){
    const preferred = candidates.filter(t =>
      flexMap[`${dateStr}_${t.name}`] && t.flexCount < 3
    );

    if(preferred.length>0){
      preferred.sort((a,b)=>a.flexCount-b.flexCount || a.totalHours-b.totalHours);
      return preferred[0];
    }
  }

  candidates.sort((a,b)=>{
    let aScore = 0;
    let bScore = 0;

    aScore += a.totalHours * 100;
    bScore += b.totalHours * 100;

    aScore += a.totalCount * 8;
    bScore += b.totalCount * 8;

    if(slot.part==="morning"){
      aScore += a.morningHours * 20 + a.morningCount * 5;
      bScore += b.morningHours * 20 + b.morningCount * 5;
    }

    if(slot.part==="afternoon"){
      aScore += a.afternoonHours * 25 + a.afternoonCount * 8;
      bScore += b.afternoonHours * 25 + b.afternoonCount * 8;
    }

    if(slot.type==="flex"){
      if(a.flexCount < 2) aScore -= 300;
      if(b.flexCount < 2) bScore -= 300;

      aScore += a.flexCount * 120;
      bScore += b.flexCount * 120;
    }

    if(alreadyAssignedToday.some(x=>x.room===a.room)) aScore += 15;
    if(alreadyAssignedToday.some(x=>x.room===b.room)) bScore += 15;

    if(alreadyAssignedToday.some(x=>x.age===a.age)) aScore += 5;
    if(alreadyAssignedToday.some(x=>x.age===b.age)) bScore += 5;

    if(a.status==="신입" && alreadyAssignedToday.some(x=>x.status==="신입" && x.room===a.room)) aScore += 80;
    if(b.status==="신입" && alreadyAssignedToday.some(x=>x.status==="신입" && x.room===b.room)) bScore += 80;

    if(slot.type==="evening" || slot.type==="eveningManager"){
      if(a.morningManagerCount>0) aScore += 60;
      if(b.morningManagerCount>0) bScore += 60;
    }

    if(slot.type==="eveningManager"){
      aScore += (eveningManagerCounts[a.name] || 0) * 50;
      bScore += (eveningManagerCounts[b.name] || 0) * 50;
    }

    aScore += nameHash(a.name + dateStr + slot.key);
    bScore += nameHash(b.name + dateStr + slot.key);

    return aScore-bScore;
  });

  return candidates[0];
}

async function generateSchedule(){
  const monthValue = monthInput.value;
  if(!monthValue) return alert("월을 선택해줘.");

  const teachers = parseTeachers();
  const dates = getMonthDates(monthValue);
  const finalRows = [];

  dates.forEach(day=>{
    const row = {
      dateStr:day.dateStr,
      day:day.day,
      weekday:day.weekday,
      isHoliday:day.isHoliday,
      holidayReason:day.holidayReason
    };

    if(day.isHoliday){
      finalRows.push(row);
      return;
    }

    slots.forEach(slot=>{
      const teacher = chooseTeacher(teachers, slot, day.dateStr);

      if(teacher){
        row[slot.key] = teacher.name;

        teacher.totalHours += slot.hours;
        teacher.totalCount++;

        if(slot.part==="morning"){
          teacher.morningHours += slot.hours;
          teacher.morningCount++;
        }

        if(slot.part==="afternoon"){
          teacher.afternoonHours += slot.hours;
          teacher.afternoonCount++;
        }

        if(slot.type==="flex"){
          teacher.flexCount++;
        }

        teacher.assignedDates.push(day.dateStr);

        const cleanTime = slot.time.replaceAll("<br>"," ");
        const cleanRole = slot.role ? slot.role.replaceAll("<br>"," ") : slot.room;
        teacher.dutyDates.push(`${day.day}일(${day.weekday}) ${cleanTime} ${cleanRole}`);

        if(slot.type==="early7" || slot.type==="morningManager"){
          teacher.assignedEarly7Today = day.dateStr;
        }

        if(slot.type==="morningManager"){
          teacher.morningManagerCount++;
        }

        if(slot.type==="eveningManager"){
          teacher.eveningManagerCountThisMonth++;
          eveningManagerCounts[teacher.name] =
            (eveningManagerCounts[teacher.name] || 0) + 1;
        }
      }else{
        row[slot.key] = "배정불가";
      }
    });

    finalRows.push(row);
  });

  currentSchedule = finalRows;
  currentStats = teachers;

  await saveAppData("eveningManagerCounts", eveningManagerCounts);

  renderSchedule(finalRows);
  renderStats(teachers);
}

function slotClass(s){
  if(s.time.includes("07:00")) return "slot-7";
  if(s.time.includes("07:30")) return "slot-730";
  if(s.time.includes("08:00")) return "slot-8";
  if(s.time.includes("08:30")) return "slot-flex";
  return "slot-afternoon";
}

async function saveCurrentSchedule(){
  const month = monthInput.value;

  if(!month || currentSchedule.length===0){
    return alert("먼저 당직표를 생성해줘.");
  }

  try{
    const latestSchedules = await loadAppData("savedSchedules") || {};

    latestSchedules[month] = {
      schedule:currentSchedule,
      stats:currentStats,
      savedAt:new Date().toISOString(),
      savedBy:dutyCurrentAdmin?.name || dutyCurrentAdmin?.username || "관리자"
    };

    await saveAppData("savedSchedules", latestSchedules);

    const verifiedSchedules = await loadAppData("savedSchedules") || {};
    if(!verifiedSchedules[month]){
      throw new Error("저장 후 검증 실패");
    }

    savedSchedules = verifiedSchedules;
    renderSavedScheduleList();
    savedScheduleSelect.value = month;

    alert(`${month} 당직표가 공용 서버에 저장되었습니다.`);
  }catch(error){
    console.error("당직표 저장 실패:", error);
    alert("당직표가 서버에 저장되지 않았습니다. 인터넷 연결 또는 Supabase 권한을 확인해 주세요.");
  }
}

async function refreshSavedSchedules(showMessage=false){
  try{
    const selectedMonth = savedScheduleSelect.value;
    const latest = await loadAppData("savedSchedules");

    savedSchedules = latest || {};
    renderSavedScheduleList();

    if(selectedMonth && savedSchedules[selectedMonth]){
      savedScheduleSelect.value = selectedMonth;
    }

    if(showMessage){
      const count = Object.keys(savedSchedules).length;
      alert(`저장된 당직표 목록을 새로고침했습니다. 총 ${count}개입니다.`);
    }
  }catch(error){
    console.error("저장목록 새로고침 실패:", error);
    if(showMessage){
      alert("저장된 당직표 목록을 불러오지 못했습니다.");
    }
  }
}

function renderSavedScheduleList(){
  savedScheduleSelect.innerHTML = "";
  Object.keys(savedSchedules).sort().forEach(month=>{
    const op = document.createElement("option");
    op.value = month;
    op.textContent = `${month} 저장본`;
    savedScheduleSelect.appendChild(op);
  });
}

async function loadSavedSchedule(){
  const month = savedScheduleSelect.value;
  if(!month) return alert("저장된 당직표가 없습니다.");

  try{
    const latest = await loadAppData("savedSchedules") || {};
    savedSchedules = latest;
    renderSavedScheduleList();

    if(!savedSchedules[month]){
      return alert("선택한 저장본이 서버에 없습니다. 목록을 다시 확인해 주세요.");
    }

    savedScheduleSelect.value = month;
    currentSchedule = savedSchedules[month].schedule;
    currentStats = savedSchedules[month].stats;

    monthInput.value = month;
    renderSchedule(currentSchedule);
    renderStats(currentStats);
  }catch(error){
    console.error("저장본 불러오기 실패:", error);
    alert("저장된 당직표를 불러오지 못했습니다.");
  }
}

async function deleteSavedSchedule(){
  const month = savedScheduleSelect.value;
  if(!month) return;
  if(!confirm(`${month} 저장본을 삭제할까요?`)) return;

  try{
    const latest = await loadAppData("savedSchedules") || {};
    delete latest[month];

    await saveAppData("savedSchedules", latest);

    savedSchedules = await loadAppData("savedSchedules") || {};
    renderSavedScheduleList();

    alert(`${month} 저장본을 삭제했습니다.`);
  }catch(error){
    console.error("저장본 삭제 실패:", error);
    alert("저장본을 삭제하지 못했습니다.");
  }
}

function downloadTableAsExcel(tableId, filename){
  const table = document.getElementById(tableId);
  if(!table) return alert("다운로드할 내용이 없습니다.");

  const html = `<html><head><meta charset="UTF-8"></head><body>${table.outerHTML}</div>
</body></html>`;
  const blob = new Blob([html], {type:"application/vnd.ms-excel;charset=utf-8;"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename + ".xls";
  link.click();
}

function downloadScheduleExcel(){
  downloadTableAsExcel("scheduleTable","당직표");
}

function downloadStatsExcel(){
  downloadTableAsExcel("statsTable","교사별통계");
}
